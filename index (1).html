<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ECEFC4">
<meta name="description" content="Сад слов — карточки и упражнения по английскому: по чуть-чуть каждый день.">
<title>Сад слов</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='22' fill='%23839958'/%3E%3Cpath d='M24 36 C14 30 14 18 24 12 C34 18 34 30 24 36 Z' fill='%23F7F4D5'/%3E%3Cpath d='M24 36 V18' stroke='%23839958' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;500;600;700;800&family=Marck+Script&display=swap">
<style>
/* Layout: светлый «урок в Miro» — бежевый лист, карточки-таблички со скруглением, рукописные заголовки разделов, пилюли-кнопки; урок — одна крупная карточка по центру */
:root{
  --cream:#F7F4D5; --paper:#FFFDF2; --paper-2:#F1EFD0; --matcha:#E6EBC9;
  --forest:#0A3323; --moss:#839958; --moss-deep:#5F7A3C; --rose:#D3968C; --rose-ink:#9C5447; --teal:#105666;
  --ink:#0A3323; --ink-2:#4F6150; --line:rgba(10,51,35,.14); --line-2:rgba(10,51,35,.26);
  --shadow:0 1px 0 rgba(10,51,35,.04), 0 14px 32px -20px rgba(10,51,35,.45);
  --f-display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body:"Manrope", "Segoe UI", system-ui, sans-serif;
  --f-script:"Marck Script", "Segoe Script", cursive;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--cream);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;position:relative;
  background:#ECEFC4}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:#ECEFC4 var(--bgimg) center bottom/cover no-repeat}
.motes{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.motes i{position:absolute;top:-20px;width:11px;height:8px;border-radius:70% 0 70% 0;background:var(--rose);opacity:0;animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:.55}90%{opacity:.45}100%{transform:translate(var(--dx,30px),108vh) rotate(320deg);opacity:0}}
.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:24px 64px;display:flex;flex-direction:column;gap:30px}
h1,h2,h3{margin:0;line-height:1.1;text-wrap:balance}
.lbl{font-family:var(--f-body);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--moss-deep)}
.muted{color:var(--ink-2);font-size:14px;margin:0}
.err{color:var(--rose-ink);font-size:14px;margin:0}

/* header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:6px 0 18px;border-bottom:1.5px dashed var(--line-2)}
.brand{display:flex;align-items:center;gap:14px}
.brand .seal{width:54px;height:54px;flex:none}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,6vw,52px);letter-spacing:-.01em;color:var(--forest);text-transform:uppercase}
.brand h1 b{color:var(--moss);font-weight:800}
.brand p{margin:0;font-family:var(--f-script);font-size:clamp(20px,3vw,26px);color:var(--rose-ink);line-height:1.1}
.player{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:8px 10px 8px 18px;box-shadow:var(--shadow)}
.role{font-family:var(--f-body);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 12px;border:1.5px solid var(--moss);color:var(--moss-deep);border-radius:999px}
.rank{display:flex;flex-direction:column;gap:4px;min-width:150px}
.rank .t{font-family:var(--f-script);font-size:22px;line-height:1;color:var(--forest)}
.bar{height:7px;background:var(--matcha);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--moss);border-radius:99px}
.rank .s{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.streak{display:flex;align-items:center;gap:6px;background:var(--rose);color:var(--paper);border-radius:999px;padding:6px 14px}
.streak b{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums;line-height:1}
.streak span{font-size:11px;line-height:1.15;font-weight:700}
.sndbtn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--paper);color:var(--forest);cursor:pointer;display:grid;place-items:center;flex:none}
.sndbtn svg{width:19px;height:19px}
.sndbtn[aria-pressed="false"]{color:var(--ink-2)}

/* buttons */
.btn{font-family:var(--f-body);font-size:14px;font-weight:700;letter-spacing:.01em;border:1.5px solid var(--forest);background:transparent;color:var(--forest);
  padding:9px 18px 10px;min-height:42px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;transition:background .15s,color .15s,transform .1s,box-shadow .15s}
.btn:hover{background:var(--matcha)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.primary{background:var(--forest);color:var(--cream);box-shadow:0 8px 18px -10px rgba(10,51,35,.7)}
.btn.primary:hover{background:#13472f}
.btn.danger{border-color:var(--rose-ink);color:var(--rose-ink)}
.btn.quiet{border-color:transparent;color:var(--moss-deep)}
.btn.quiet:hover{background:rgba(131,153,88,.14)}
.btn[disabled]{opacity:.35;cursor:not-allowed;box-shadow:none}
.btn small{font-weight:500;font-size:12px;opacity:.85}
.btn.hintbtn{border-color:var(--teal);color:var(--teal);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(16,86,102,.12)}}
:focus-visible{outline:2.5px solid var(--rose);outline-offset:3px}
button,.tile,.opt,.flip{touch-action:manipulation;-webkit-tap-highlight-color:transparent}

.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font-family:var(--f-body);font-size:15px;font-weight:700;background:var(--paper);border:1.5px solid var(--line);color:var(--ink-2);padding:8px 18px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--moss);border-color:var(--moss);color:var(--paper)}

.sec{display:flex;flex-direction:column;gap:16px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.sec-head h2{font-family:var(--f-script);font-weight:400;font-size:42px;color:var(--forest);line-height:1}
.sec-head h2 em{font-style:normal;color:var(--rose-ink)}
.sec-head .row{display:flex;gap:10px;flex-wrap:wrap}
.notice{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px 18px;max-width:75ch}
.notice p{margin:0}

.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
.deck{background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0;position:relative;overflow:hidden;transition:transform .2s}
@media (hover:hover){.deck:hover{transform:translateY(-3px) rotate(-.3deg)}}
.deck::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--matcha);opacity:.6;pointer-events:none}
.deck.teacher::after{background:#F2DCD6}
.deck .head{display:flex;gap:14px;align-items:flex-start;min-width:0;position:relative;z-index:1}
.initial{flex:none;width:56px;height:56px;display:grid;place-items:center;background:var(--moss);color:var(--paper);font-family:var(--f-script);font-size:36px;line-height:1;border-radius:50%;box-shadow:inset 0 -4px 0 rgba(10,51,35,.15)}
.deck.teacher .initial{background:var(--rose)}
.deck h3{font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.2;overflow-wrap:anywhere;color:var(--forest)}
.deck .from{display:inline-block;margin-top:6px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--paper);background:var(--rose);padding:2px 9px;border-radius:999px}
.deck .from[style]{background:var(--matcha);color:var(--moss-deep)!important}
.mix{font-size:13px;color:var(--ink-2);display:block;margin-top:4px}
.counts{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;position:relative;z-index:1}
.counts b{font-family:var(--f-display);font-size:20px;color:var(--forest);margin-right:4px}
.counts .due b{color:var(--rose-ink)} .counts .new b{color:var(--teal)}
.deck .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:14px;border-top:1.5px dashed var(--line)}
.deck .acts .btn.primary{flex:1 1 100%}
.empty{background:rgba(255,253,242,.7);border:1.5px dashed var(--line-2);border-radius:24px;padding:26px;text-align:center;color:var(--ink-2)}
.empty p{margin:0 auto;max-width:52ch}
.prog-line{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.prog-line .bar{flex:1;min-width:60px}

input.f,textarea.f,select.f{font-family:var(--f-body);font-size:16px;color:var(--ink);background:var(--paper);border:1.5px solid var(--line-2);border-radius:14px;padding:10px 12px;width:100%;resize:vertical}
input.f::placeholder,textarea.f::placeholder{color:rgba(79,97,80,.55)}
input.f:focus,textarea.f:focus,select.f:focus{border-color:var(--moss);outline:3px solid rgba(131,153,88,.25);outline-offset:0}
label.fl,.fl{display:flex;flex-direction:column;gap:6px}
.ed-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:24px;align-items:start}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
.panel h3{font-family:var(--f-script);font-weight:400;font-size:32px;color:var(--forest)}
.cardrow{display:grid;grid-template-columns:26px 112px minmax(0,1fr) minmax(0,1fr) 34px;gap:10px;align-items:start;padding:8px 0;border-bottom:1.5px dashed var(--line)}
.colheads{display:grid;grid-template-columns:26px 112px minmax(0,1fr) minmax(0,1fr) 34px;gap:10px}
.cardrow .num{font-family:var(--f-display);font-size:14px;color:var(--moss);padding-top:12px;text-align:right;font-variant-numeric:tabular-nums}
.cardrow select.f{padding:10px 6px}
.rownote{grid-column:3 / 5;font-size:13px;color:var(--rose-ink);margin:-4px 0 0}
.x{background:none;border:0;color:var(--ink-2);font-size:22px;line-height:1;cursor:pointer;padding:8px 4px;border-radius:50%}
.x:hover{color:var(--rose-ink)}
.saved{font-size:13px;color:var(--ink-2);font-style:italic}

.modebar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.modebar .ttl{flex:1;min-width:0}
.modebar h2{font-family:var(--f-display);font-weight:600;font-size:clamp(20px,3.4vw,28px);overflow-wrap:anywhere;color:var(--forest)}
.progress{height:8px;background:var(--matcha);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--moss);border-radius:99px;transition:width .3s}
.tally{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ink-2);margin-top:10px;font-variant-numeric:tabular-nums}
.tally b{color:var(--forest)} .tally .n b{color:var(--teal)} .tally .r b{color:var(--rose-ink)}
.lives{display:inline-flex;gap:4px;align-items:center;margin-left:auto}
.heart{width:24px;height:22px;fill:var(--rose);stroke:var(--rose-ink);stroke-width:1;transition:fill .3s}
.heart.lost{fill:transparent;stroke:rgba(156,84,71,.35)}
.heart.drop{animation:drop .6s ease-out}
.heart.gain{animation:gain .6s ease-out}
@keyframes drop{0%{transform:scale(1.3)}40%{transform:translateY(-4px) rotate(-12deg)}100%{transform:none}}
@keyframes gain{0%{transform:scale(.4)}60%{transform:scale(1.35)}100%{transform:none}}
.lives.low .heart:not(.lost){animation:beat 1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}

.stage{display:flex;flex-direction:column;align-items:center;gap:22px}
.leaf{width:100%;max-width:680px;min-height:290px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:30px;
  padding:42px 32px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;position:relative}
.leaf::before{content:"";position:absolute;inset:10px;border:1.5px dashed rgba(131,153,88,.35);border-radius:22px;pointer-events:none}
.leaf .lbl{background:var(--matcha);padding:4px 12px;border-radius:999px}
.leaf .q,.leaf .a{font-family:var(--f-display);font-size:clamp(26px,4.6vw,40px);font-weight:600;line-height:1.2;overflow-wrap:anywhere;text-wrap:balance;color:var(--forest)}
.leaf .a{color:var(--rose-ink)}
.leaf .q.long,.leaf .a.long{font-size:clamp(19px,3.2vw,26px);line-height:1.35}
.fleuron{color:var(--rose);font-size:20px;letter-spacing:.6em;margin-right:-.6em}
.answers{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%;max-width:680px}
.answers .btn{flex:1 1 130px;flex-direction:column;gap:2px;padding:10px 12px;border-radius:20px}
.g0{border-color:var(--rose-ink);color:var(--rose-ink)} .g1{border-color:var(--moss);color:var(--moss-deep)}
.g2{border-color:var(--forest);color:var(--forest)} .g3{border-color:var(--teal);color:var(--teal)}
.kbd{font-size:11px;opacity:.55;font-weight:500}
.hint{font-style:italic;color:var(--teal);font-size:16px;margin:0;max-width:52ch}
.hintbox{border-top:1.5px dashed rgba(16,86,102,.3);padding-top:12px;animation:fadein .4s}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}}

.result{max-width:600px;width:100%;text-align:center;align-items:center}
.result h3{font-family:var(--f-script);font-weight:400;font-size:48px;color:var(--forest)}
.result .stats{display:flex;gap:28px;justify-content:center;flex-wrap:wrap}
.result .stats div{display:flex;flex-direction:column}
.result .stats b{font-family:var(--f-display);font-size:30px;color:var(--moss-deep);font-variant-numeric:tabular-nums;line-height:1.1}
.result .stats span{font-size:13px;color:var(--ink-2)}
.result .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.result.fallen h3{color:var(--rose-ink)}

.flip-wrap{width:100%;max-width:680px;perspective:1400px;touch-action:pan-y;transition:transform .25s ease;position:relative}
.flip{display:block;width:100%;min-height:310px;position:relative;border:0;padding:0;background:none;cursor:pointer;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.25,.5,1);font:inherit;color:inherit}
.flip.is-flipped{transform:rotateY(180deg)}
.flip .leaf{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;max-width:none}
.flip .leaf.back{transform:rotateY(180deg);background:#F6EDE6}
.flip-wrap[data-dir="yes"] .leaf{border-color:var(--moss);box-shadow:0 0 0 4px rgba(131,153,88,.3)}
.flip-wrap[data-dir="no"] .leaf{border-color:var(--rose);box-shadow:0 0 0 4px rgba(211,150,140,.35)}
.navrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.navrow .pos{font-family:var(--f-display);font-size:18px;min-width:80px;text-align:center;font-variant-numeric:tabular-nums}
.knowrow .btn{min-width:140px}
.touch-only{display:none}

.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;max-width:680px}
.opt{font-family:var(--f-body);font-size:17px;font-weight:600;text-align:left;cursor:pointer;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:20px;padding:14px 16px;display:flex;gap:12px;align-items:baseline;min-width:0;overflow-wrap:anywhere;transition:border-color .15s,opacity .3s,transform .1s}
.opt:hover:not([disabled]){border-color:var(--moss)}
.opt .n{font-family:var(--f-display);font-size:13px;color:var(--moss)}
.opt.ok{border-color:var(--moss);background:var(--matcha)}
.opt.bad{border-color:var(--rose);background:#F6E3DF;color:var(--rose-ink)}
.opt.gone{opacity:.15;pointer-events:none}
.opt[disabled]{cursor:default}

.mtop{display:flex;gap:24px;justify-content:center;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.mtop b{font-family:var(--f-display);font-size:22px;color:var(--forest);font-variant-numeric:tabular-nums}
.mtop .lives{margin-left:0}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:100%;max-width:860px}
.tile{min-height:96px;padding:12px;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:20px;cursor:pointer;font-family:var(--f-body);font-size:16px;font-weight:600;line-height:1.25;overflow-wrap:anywhere;min-width:0;transition:transform .15s,opacity .3s}
.tile:hover{border-color:var(--moss)}
.tile.sel{border-color:var(--moss);background:var(--matcha);transform:translateY(-3px)}
.tile.wrong{border-color:var(--rose);background:#F6E3DF;animation:shake .3s}
.tile.gone{visibility:hidden}
.tile:active,.opt:active{transform:scale(.97)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.gap{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--rose);margin:0 .12em;transform:translateY(-.08em)}
mark.ans{background:#F2DCD6;color:var(--rose-ink);padding:0 .2em;border-radius:6px}
.typebox{display:flex;gap:10px;width:100%;max-width:680px;flex-wrap:wrap}
.typebox input{flex:1 1 260px;font-size:19px;padding:12px 16px;border-radius:999px}
.verdict{width:100%;max-width:680px;border-radius:20px;padding:12px 18px;border:1.5px solid var(--line);background:var(--paper);display:flex;flex-direction:column;gap:4px}
.verdict b{font-family:var(--f-display);font-size:18px}
.verdict.ok{border-color:var(--moss);background:#F1F4E1} .verdict.ok b{color:var(--moss-deep)}
.verdict.typo{border-color:var(--moss)} .verdict.typo b{color:var(--moss-deep)}
.verdict.bad{border-color:var(--rose);background:#FBF0EC} .verdict.bad b{color:var(--rose-ink)}
.verdict .yours{font-size:14px;color:var(--ink-2)} .verdict .yours s{color:var(--rose-ink)}
.tb{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 9px;border-radius:999px;background:var(--matcha);color:var(--moss-deep);white-space:nowrap}
.tb.gap-t{background:#F2DCD6;color:var(--rose-ink)} .tb.trans-t{background:#D7E7EA;color:var(--teal)}
.pill{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--paper-2);color:var(--ink-2)}
.pill.hard{background:var(--rose);color:var(--paper)} .pill.new{background:#D7E7EA;color:var(--teal)} .pill.master{background:var(--moss);color:var(--paper)}
.tablewrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:20px}
table.words{width:100%;border-collapse:collapse;font-size:15px;min-width:560px}
table.words th{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--moss-deep);text-align:left;padding:12px;border-bottom:1.5px dashed var(--line-2)}
table.words td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.words tr:last-child td{border-bottom:0}
table.words td.num{color:var(--moss);font-family:var(--f-display);font-size:13px;font-variant-numeric:tabular-nums;width:1%}
table.words tr.is-hard td:first-child{box-shadow:inset 3px 0 0 var(--rose)}
table.words .hint{font-size:13px}
.miss{font-size:12px;color:var(--rose-ink);display:block;margin-top:3px;font-variant-numeric:tabular-nums}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters .btn{padding:6px 14px;font-size:13px;min-height:36px;border-color:var(--line-2)}
.filters .btn[aria-pressed="true"]{background:var(--moss);color:var(--paper);border-color:var(--moss)}
.weakbox{background:#FBF0EC;border:1px solid rgba(211,150,140,.5);border-radius:24px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.weakbox h3{font-family:var(--f-script);font-weight:400;font-size:34px;color:var(--rose-ink)}
.weakbox .sec-head h3{line-height:1}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:14px;padding:4px 12px;border-radius:999px;background:var(--paper);border:1px solid rgba(211,150,140,.5)}
.chip b{color:var(--rose-ink);font-weight:800;font-size:12px;margin-left:5px;font-variant-numeric:tabular-nums}

/* поляна */
.garden-card{display:flex;flex-direction:column;gap:12px}
.meadow-mini{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:24px;overflow:hidden;cursor:pointer;background:none;box-shadow:var(--shadow)}
.meadow-mini svg{display:block;width:100%;height:auto}
.meadow-wrap{border-radius:28px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:#b5c47d}
svg.meadow{display:block;width:100%;height:auto}
.pl-sway{animation:sway 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.pl-grow{animation:grow 1.4s cubic-bezier(.3,1.5,.5,1) both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes grow{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes sway{50%{transform:rotate(2.2deg)}}
.garden-legend .chip b{color:var(--moss-deep)}
.reward{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 18px 16px;border-radius:24px;background:var(--matcha);width:100%;max-width:420px}
.reward p{margin:0;font-size:15px}
.reward-plant{width:96px;height:118px;overflow:visible}
.reward-plant .pl-grow{animation-delay:.35s}
/* guide: Мила */
#gslot:empty{display:none}
.guide{display:flex;align-items:flex-end;gap:14px}
.guide.mini{align-items:center;gap:12px}
.gfig{background:var(--matcha);border:1px solid var(--line);padding:0;cursor:pointer;flex:none;overflow:hidden;position:relative}
.guide.full .gfig{width:150px;height:210px;border-radius:75px 75px 22px 22px;box-shadow:var(--shadow)}
.guide.full .gfig::before{content:"";position:absolute;inset:7px;border:1.5px solid rgba(255,253,242,.8);border-radius:68px 68px 16px 16px;pointer-events:none;z-index:1}
.guide.mini .gfig{width:62px;height:62px;border-radius:50%}
.mila{width:100%;height:100%;display:block}
.guide.full .mila{animation:gfloat 4.5s ease-in-out infinite}
@keyframes gfloat{50%{transform:translateY(-4px)}}
.mila .eyes{transform-origin:60px 52px;animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.mila .joy{display:none}
.guide.happy .joy{display:inline}.guide.happy .eyes{display:none}
.guide.happy .gfig{animation:hop .6s ease-out;background:#EEF2D6}
.guide.happy .cup{transform:rotate(-12deg);transform-origin:56px 140px;transition:transform .3s}
@keyframes hop{30%{transform:translateY(-8px)}}
.guide.sad .mouth{transform:scaleY(-1);transform-origin:60px 62px}
.guide.sad .gfig{background:#F2DCD6}
.bubble{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:14px 18px;flex:1;min-width:0;max-width:680px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.bubble::before{content:"";position:absolute;left:-7px;bottom:28px;width:14px;height:14px;background:var(--paper);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.guide.mini .bubble::before{bottom:auto;top:calc(50% - 7px)}
.gname{font-family:var(--f-script);font-size:22px;color:var(--rose-ink);line-height:1}
.gsay{margin:0;display:grid;font-size:16px;line-height:1.5}
.gsay>span{grid-area:1/1}
.gsay .sizer{visibility:hidden}
.guide.full .gsay{font-size:clamp(16px,2vw,18px)}
.guide.full .bubble{margin-bottom:26px}
.bubble .row{display:flex;gap:8px;flex-wrap:wrap}
.bubble .hintbtn{align-self:flex-start}

/* fx */
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:45;pointer-events:none}
#flash{position:fixed;inset:0;z-index:44;pointer-events:none;opacity:0}
#flash.hurt{background:radial-gradient(ellipse at center,transparent 50%,rgba(211,150,140,.45));animation:flash .55s ease-out}
#flash.fallen{background:radial-gradient(ellipse at center,rgba(211,150,140,.15),rgba(211,150,140,.5));animation:flash 1.5s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.floater{position:fixed;z-index:46;pointer-events:none;font-family:var(--f-display);font-weight:800;font-size:26px;color:var(--moss-deep);
  text-shadow:0 2px 0 var(--paper),0 0 12px rgba(255,253,242,.9);animation:floatup 1.25s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-70%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-240%) scale(1)}}
.leaf.glow-ok,.opt.ok{animation:glowok .9s ease-out}
@keyframes glowok{0%{box-shadow:0 0 0 0 rgba(131,153,88,.6),var(--shadow)}100%{box-shadow:0 0 0 24px rgba(131,153,88,0),var(--shadow)}}
.leaf.hit{animation:hit .45s}
@keyframes hit{0%{border-color:var(--rose)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}100%{transform:none}}
.reveal{animation:reveal .55s ease-out}
@keyframes reveal{from{opacity:0;transform:translateY(10px) scale(.96);filter:blur(5px)}}
#app.enter{animation:enter .45s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(12px)}}

#modal{position:fixed;inset:0;z-index:50;background:rgba(10,51,35,.35);display:flex;align-items:center;justify-content:center;
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
#modal .box{width:100%;max-width:520px;max-height:90vh;overflow:auto}
#modal h3{font-family:var(--f-script);font-weight:400;font-size:34px;color:var(--forest)}
#modal .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
#toasts{position:fixed;right:calc(16px + env(safe-area-inset-right, 0px));bottom:calc(16px + env(safe-area-inset-bottom, 0px));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{background:var(--forest);color:var(--cream);font-size:14px;font-weight:600;padding:9px 16px;border-radius:999px;box-shadow:var(--shadow);animation:pop 2.4s forwards}
@keyframes pop{0%{opacity:0;transform:translateY(8px)}10%,82%{opacity:1;transform:none}100%{opacity:0}}
.loading{padding:60px 0;text-align:center;color:var(--ink-2);font-style:italic}
footer.foot{font-size:13px;color:var(--ink-2);text-align:center}

@media (hover:none){.kbd{display:none}.touch-only{display:inline}.btn:hover{background:transparent}.btn.primary:hover{background:var(--forest)}}
@media (max-width:800px){.ed-grid{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){
  .wrap{gap:22px;padding-block:16px 40px}
  header.top{gap:12px;padding-bottom:14px}
  .brand .seal{width:42px;height:42px}
  .player{width:100%;justify-content:space-between;gap:10px;padding:6px 6px 6px 14px;border-radius:22px}
  .player .role{display:none}
  .rank{min-width:0;flex:1}
  .sec-head h2{font-size:34px}
  .opts{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .tile{min-height:68px;font-size:15px;padding:8px}
  .cardrow{grid-template-columns:minmax(0,1fr) 34px}.cardrow .num,.colheads{display:none}
  .cardrow textarea{grid-column:1 / -1}.rownote{grid-column:1 / -1}
  .decks{grid-template-columns:1fr}
  .modebar{gap:6px}
  .tally{gap:12px}
  .heart{width:21px;height:19px}
  .stage{gap:16px}
  .leaf{min-height:210px;padding:30px 18px;border-radius:26px}
  .leaf .q,.leaf .a{font-size:clamp(23px,7vw,30px)}
  .leaf .q.long,.leaf .a.long{font-size:clamp(18px,5vw,22px)}
  .flip{min-height:250px}
  .answers{position:sticky;bottom:0;z-index:6;gap:8px;padding:12px 0 calc(12px + env(safe-area-inset-bottom, 0px));background:linear-gradient(180deg,rgba(247,244,213,0),var(--cream) 30%)}
  .answers .btn{flex:1 1 0;min-width:0;min-height:52px;padding:8px 4px;font-size:13px}
  .answers .btn small{font-size:11px}
  .typebox input{flex-basis:100%}.typebox .btn{width:100%;min-height:48px}
  .opt{padding:12px 14px;font-size:16px;min-height:52px}
  .knowrow{width:100%}.knowrow .btn{min-width:0;flex:1 1 0;min-height:52px;white-space:nowrap}
  .deck{padding:16px}
  .deck .acts .btn{flex:1 1 auto;min-height:44px}
  .filters{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
  .filters .btn{flex:none}
  .result h3{font-size:40px}
  #toasts{top:calc(10px + env(safe-area-inset-top, 0px));bottom:auto;left:max(16px, env(safe-area-inset-left, 0px));right:max(16px, env(safe-area-inset-right, 0px));align-items:center}
  .guide{gap:10px}
  .guide.full .gfig{width:100px;height:140px;border-radius:50px 50px 18px 18px}
  .guide.full .gfig::before{border-radius:44px 44px 12px 12px;inset:5px}
  .guide.mini .gfig{width:50px;height:50px}
  .gsay,.guide.full .gsay{font-size:15px}
  .bubble{padding:10px 14px}
  .guide.full .bubble{margin-bottom:14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.motes{display:none}}
</style>

/* ===================== типы карточек ===================== */
const TYPES={word:'Слово',gap:'Пропуск',trans:'Перевод'};
const tOf=c=>c.t||'word';
const groups=f=>[...String(f||'').matchAll(/\[([^\]]+)\]/g)].map(m=>m[1]);
const valid=c=>tOf(c)!=='gap'||groups(c.f).length>0;
const isTyped=c=>(tOf(c)==='gap'&&groups(c.f).length>0)||(tOf(c)==='trans'&&String(c.b||'').trim()!=='');
const firstAlt=g=>g.split('/')[0].trim();
function frontHTML(c){return tOf(c)==='gap'?h(c.f).replace(/\[([^\]]+)\]/g,'<span class="gap"></span>'):h(c.f);}
function fullHTML(c){
  if(tOf(c)==='gap') return h(c.f).replace(/\[([^\]]+)\]/g,(m,g)=>`<mark class="ans">${g.split('/').map(x=>x.trim()).join(' / ')}</mark>`);
  if(tOf(c)==='trans') return c.b.split('/').map(x=>h(x.trim())).join('<br><span class="hint">или</span> ');
  return h(c.b);
}
const plainFront=c=>tOf(c)==='gap'?String(c.f).replace(/\[([^\]]+)\]/g,'___'):c.f;
const answerText=c=>tOf(c)==='gap'?groups(c.f).map(firstAlt).join(' … '):tOf(c)==='trans'?firstAlt(c.b):c.b;
const isLong=s=>String(s).length>38;
function accepted(c){
  if(tOf(c)==='gap'){let out=[''];for(const g of groups(c.f)){const alts=g.split('/').map(x=>x.trim());const nx=[];for(const o of out)for(const a of alts)nx.push((o+' '+a).trim());out=nx.slice(0,64);}return out;}
  if(tOf(c)==='trans') return c.b.split('/');
  return [c.b,...c.b.split(/[\/,;]/)];
}
function norm(s){
  return String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/ё/g,'е')
    .replace(/\b(do|does|did|is|are|was|were|have|has|had|could|would|should|need)nt\b/g,"$1n't").replace(/\bdont\b/g,"don't").replace(/\bcant\b/g,"can't").replace(/\bwont\b/g,"won't").replace(/\bim\b/g,"i'm")
    .replace(/\bcan't\b|\bcannot\b/g,'can not').replace(/\bwon't\b/g,'will not').replace(/n't\b/g,' not')
    .replace(/'m\b/g,' am').replace(/'re\b/g,' are').replace(/'ve\b/g,' have').replace(/'ll\b/g,' will').replace(/'d\b/g,' would')
    .replace(/\b(it|he|she|that|what|where|who|there|here|how)'s\b/g,'$1 is')
    .replace(/[.,!?;:"«»()\-–—]/g,' ').replace(/\s+/g,' ').trim();
}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){const q=[i];for(let j=1;j<=n;j++)q[j]=Math.min(p[j]+1,q[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=q;}return p[n];}
function check(input,c){
  const n=norm(input); if(!n) return 'bad';
  const acc=accepted(c).map(norm).filter(Boolean);
  if(acc.includes(n)) return 'ok';
  const best=Math.min(...acc.map(a=>lev(n,a))); const tol=n.length>=12?2:n.length>=5?1:0;
  return best<=tol?'typo':'bad';
}

/* ===================== эффекты: частицы ===================== */
const FX=(()=>{
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let cv,ctx,ps=[],run=false,dpr=1;
  const small=()=>innerWidth<560;
  function size(){dpr=Math.min(small()?1.5:2,devicePixelRatio||1);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;}
  function loop(){
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,innerWidth,innerHeight);
    ctx.globalCompositeOperation='source-over';
    ps=ps.filter(p=>p.life>0);
    for(const p of ps){
      p.life--;const k=p.life/p.max;
      if(p.ring){p.r+=(p.R-p.r)*.14;ctx.strokeStyle=p.col;ctx.globalAlpha=k;ctx.lineWidth=2*k+.5;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.stroke();continue;}
      p.vx*=p.drag;p.vy=p.vy*p.drag+p.g;p.x+=p.vx;p.y+=p.vy;
      ctx.globalAlpha=Math.min(1,k*1.4);ctx.fillStyle=p.col;
      if(p.shard){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot+=p.vr);ctx.fillRect(-p.s,-p.s/3,p.s*2,p.s/1.5);ctx.restore();}
      else{ctx.beginPath();ctx.arc(p.x,p.y,p.s*(.4+k*.6),0,7);ctx.fill();
        if(p.trail){ctx.globalAlpha*=.35;ctx.beginPath();ctx.arc(p.x-p.vx*2,p.y-p.vy*2,p.s*.5,0,7);ctx.fill();}}
    }
    ctx.globalAlpha=1;
    if(ps.length)requestAnimationFrame(loop);else{run=false;ctx.clearRect(0,0,innerWidth,innerHeight);}
  }
  function add(p){ps.push(p);if(!run){run=true;requestAnimationFrame(loop);}}
  const api={
    init(){cv=$('#fx');if(!cv)return;ctx=cv.getContext('2d');size();addEventListener('resize',size);},
    burst(x,y,o={}){if(reduce||!ctx)return;const n=Math.round((o.n||24)*(small()?.6:1)),cols=o.colors||['#839958','#b5c77d'];
      for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=(o.speed||5)*(.3+Math.random()*.9),life=(o.life||46)*(.6+Math.random()*.6);
        add({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(o.up||0),g:o.g??.12,drag:o.drag||.94,s:(o.size||2.4)*(.6+Math.random()*.8),col:cols[i%cols.length],life,max:life,
          shard:!!o.shard,rot:Math.random()*6,vr:(Math.random()-.5)*.4,trail:!!o.trail});}},
    ring(x,y,col='#839958',R=34){if(reduce||!ctx)return;add({ring:true,x,y,r:4,R,col,life:26,max:26});},
    firework(x,y){api.ring(x,y,'#b5c77d',60);api.burst(x,y,{n:60,speed:7,g:.07,drag:.965,life:70,size:2,trail:true,colors:['#839958','#b5c77d','#105666','#e3b7ae','#D3968C']});},
    fireworks(k=5){if(reduce)return;for(let i=0;i<k;i++)setTimeout(()=>api.firework(innerWidth*(.15+Math.random()*.7),innerHeight*(.12+Math.random()*.35)),i*260);},
    float(text,x,y,color){const el=document.createElement('div');el.className='floater';el.textContent=text;el.style.left=x+'px';el.style.top=y+'px';if(color)el.style.color=color;document.body.appendChild(el);setTimeout(()=>el.remove(),1300);},
    flash(kind){const el=$('#flash');if(!el)return;el.className='';void el.offsetWidth;el.className=kind;},
  };
  return api;
})();
function rectOf(el){if(typeof el==='string')el=document.querySelector(el);if(!el)return null;const r=el.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2,top:r.top,el};}
function pulse(el,cls){if(typeof el==='string')el=document.querySelector(el);if(!el)return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);}

const SND={on:true,ctx:null,master:null,rev:null,
  ac(){
    if(!this.on)return null;
    try{
      if(!this.ctx){
        const C=window.AudioContext||window.webkitAudioContext; if(!C) return null;
        const c=this.ctx=new C();
        const comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=12;comp.ratio.value=3;comp.attack.value=.003;comp.release.value=.25;
        this.master=c.createGain();this.master.gain.value=.85;this.master.connect(comp).connect(c.destination);
        // мягкая искусственная реверберация
        const len=Math.floor(c.sampleRate*2.2),ir=c.createBuffer(2,len,c.sampleRate);
        for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.4)*(i<c.sampleRate*.012?i/(c.sampleRate*.012):1);}
        const conv=c.createConvolver();conv.buffer=ir;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=5200;
        this.rev=c.createGain();this.rev.gain.value=.32;this.rev.connect(conv).connect(lp).connect(this.master);
      }
      if(this.ctx.state!=='running')this.ctx.resume();
    }catch(e){return null;}
    return this.ctx;
  },
  /* iOS и Android включают звук только после касания: «разогреваем» контекст тихим буфером */
  unlock(){const c=this.ac();if(!c||this.unlocked)return;try{const b=c.createBuffer(1,1,22050),s=c.createBufferSource();s.buffer=b;s.connect(c.destination);s.start(0);this.unlocked=true;}catch(e){}},
  out(node,wet){node.connect(this.master);if(wet){const g=this.ctx.createGain();g.gain.value=wet;node.connect(g).connect(this.rev);}},
  env(p,t,a,peak,d){p.setValueAtTime(.0001,t);p.exponentialRampToValueAtTime(Math.max(.0002,peak),t+a);p.exponentialRampToValueAtTime(.0001,t+a+d);},
  /* колокольчик: несколько негармоничных обертонов */
  bell(f,at=0,vol=.1,dur=1.4,wet=.45){const c=this.ac();if(!c)return;const t=c.currentTime+at,bus=c.createGain();this.out(bus,wet);
    [[1,1],[2.01,.55],[2.98,.3],[4.16,.18],[5.43,.1],[6.79,.05]].forEach(([m,a],i)=>{const o=c.createOscillator(),g=c.createGain();
      o.type='sine';o.frequency.value=f*m;this.env(g.gain,t,.003,vol*a,dur/(1+i*.7));o.connect(g).connect(bus);o.start(t);o.stop(t+dur+.1);});},
  /* щипок струны (арфа, лютня) — алгоритм Карплуса — Стронга */
  pluck(f,at=0,vol=.2,dur=1.1,wet=.3,bright=.5){const c=this.ac();if(!c)return;const sr=c.sampleRate,n=Math.floor(sr*dur),N=Math.max(2,Math.round(sr/f));
    const b=c.createBuffer(1,n,sr),d=b.getChannelData(0),ring=new Float32Array(N);
    for(let i=0;i<N;i++)ring[i]=Math.random()*2-1;
    let idx=0;const decay=.994+bright*.004;
    for(let i=0;i<n;i++){const nx=(idx+1)%N,v=ring[idx];ring[idx]=decay*(v*(.5+bright*.2)+ring[nx]*(.5-bright*.2));d[i]=v;idx=nx;}
    const s=c.createBufferSource(),g=c.createGain(),lp=c.createBiquadFilter();s.buffer=b;lp.type='lowpass';lp.frequency.value=Math.min(9000,f*8);
    const t=c.currentTime+at;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(lp).connect(g);this.out(g,wet);s.start(t);},
  /* медный духовой для фанфар */
  brass(f,at=0,dur=.5,vol=.08,wet=.35){const c=this.ac();if(!c)return;const t=c.currentTime+at,g=c.createGain(),lp=c.createBiquadFilter();

    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1);

  flip(){this.noise(.24,3400,700,.13,.6,'bandpass',.08);this.noise(.06,7000,5000,.03,.7,'highpass',0,.02);},

const Q={};
function queueSet(path,getData,delay=700,onErr){
  const p=Q[path]||(Q[path]={}); p.get=getData; p.onErr=onErr; clearTimeout(p.t);
  p.t=setTimeout(()=>flush(path),delay);
}
async function flush(path){
  const p=Q[path]; if(p.running){p.again=true;return;}
  p.running=true;
  try{await ST.db.doc(path).set(p.get());}
  catch(e){ if(e&&e.code==='unavailable'){setTimeout(()=>flush(path),1500+Math.random()*1000);} else p.onErr&&p.onErr(e); }
  p.running=false; if(p.again){p.again=false;flush(path);}
}

/* ===================== повторение и трудные слова ===================== */
const NEW={ease:2.5,ivl:0,reps:0,due:0,n:true};
const srsOf=key=>ST.srs[key]||(ST.srs[key]={});
const sched=(key,cid)=>srsOf(key)[cid]||NEW;
function schedule(c,g){
  let {ease,ivl,reps}=c, due; const now=Date.now();
  if(g===0){reps=0;ease=Math.max(1.3,ease-0.2);ivl=0;due=now+60e3;}
  else{
    if(g===1){ivl=reps===0?1:Math.max(1,Math.round(ivl*1.2));ease=Math.max(1.3,ease-0.15);}
    else if(g===2){ivl=reps===0?1:reps===1?3:Math.round(ivl*ease);}
    else{ivl=reps===0?3:reps===1?5:Math.round(ivl*ease*1.3);ease+=0.15;}
    ivl=Math.max(1,ivl);reps++;due=now+ivl*DAY;
  }
  return {ease:+ease.toFixed(2),ivl,reps,due,n:false};
}
/* «даётся плохо»: была ошибка, и после неё ещё нет трёх верных ответов подряд */
const isWeak=s=>(s.miss||0)>0&&(s.run||0)<3;
function mark(key,cid,ok){
  const m=srsOf(key); const s={...NEW,...(m[cid]||{})};
  if(ok){s.hit=(s.hit||0)+1;s.run=(s.run||0)+1;} else {s.miss=(s.miss||0)+1;s.run=0;s.lastMiss=Date.now();}
  m[cid]=s; saveSrs();
  const dk=getDeck(key); if(dk) reportProgress(dk);
}
const MAXL=5;
const HEART='<path d="M12 21s-8.5-5.4-10.4-11A5.6 5.6 0 0 1 12 4.6 5.6 5.6 0 0 1 22.4 10C20.5 15.6 12 21 12 21z"/>';
function livesHTML(){let s='';for(let i=0;i<MAXL;i++){const anim=V.fx&&V.fx.i===i?V.fx.t:'';s+=`<svg class="heart ${i<V.lives?'':'lost'} ${anim}" viewBox="0 0 24 22" aria-hidden="true">${HEART}</svg>`;}
  V.fx=null;return `<span class="lives ${V.lives<=2?'low':''}" role="img" aria-label="Жизни: ${V.lives} из ${MAXL}">${s}</span>`;}
function loseLife(){if(V.lives>0){V.lives--;V.fx={i:V.lives,t:'drop'};}V.run=0;}
function gainRun(){V.run=(V.run||0)+1;if(V.run%4===0&&V.lives<MAXL){V.fx={i:V.lives,t:'gain'};V.lives++;toast('Четыре верных ответа подряд: +1 жизнь');}}
const lifeState=()=>({lives:MAXL,run:0,hint:false,over:false,gone:[]});
const hintBtn=()=>'';
function hintFor(c){
  const t=tOf(c); const start=a=>`начинается на «${h(a.charAt(0))}», букв: ${a.replace(/[\s'’]/g,'').length}`;
  if(t==='gap'){const a=firstAlt(groups(c.f)[0]||'');return (c.b?`${h(c.b)}; `:'')+start(a).replace(/^н/,c.b?'н':'Н');}
  if(t==='trans'){const w=firstAlt(c.b).split(/\s+/);return `Перевод начинается так: «${h(w.slice(0,Math.max(1,Math.min(2,w.length-1))).join(' '))} …»`;}
  const a=firstAlt(String(c.b).split(/[,;]/)[0]);return 'Ответ '+start(a);
}
const hintArea=c=>V.hint?`<div class="hintbox"><p class="hint">${hintFor(c)}</p></div>`:'';
function fallen(mode,title){
  return `${modebar(mode,title)}<div class="stage"><div class="leaf result fallen"><span class="lbl">жизни закончились</span><h3>Нужна передышка</h3>
    <p class="muted">Ответы до этого момента сохранены. Сделайте паузу и попробуйте снова.</p>
    <div class="stats"><div><b>${V.done||V.score||0}</b><span>${V.name==='quiz'?'верных':'ответов'}</span></div><div><b>+${V.xp||0}</b><span>опыта</span></div></div>
    <div class="row"><button class="btn primary" data-act="revive">Ещё попытка · ${MAXL} жизней</button><button class="btn quiet" data-act="home">На главную</button></div></div></div>`;
}
const fmtIvl=d=>d<=0?'1 мин':d<30?`${d} ${plural(d,'день','дня','дней')}`:d<365?`${Math.round(d/30)} мес.`:`${(d/365).toFixed(1)} г.`;
function deckStats(dk){
  const now=Date.now();let due=0,nw=0,learned=0,mastered=0,weak=0;
  dk.cards.filter(valid).forEach(c=>{const s=sched(dk.key,c.id);if(isWeak(s))weak++;if(s.n)nw++;else{learned++;if(s.due<=now)due++;if(s.ivl>=21)mastered++;}});
  return {due,nw,learned,mastered,weak,all:dk.cards.filter(valid).length};
}
function statusOf(key,c){
  const s=sched(key,c.id);
  if(isWeak(s)) return {cls:'hard',t:'даётся плохо',miss:s.miss};
  if(s.n) return {cls:'new',t:'новое'};
  if(s.ivl>=21) return {cls:'master',t:'закреплено'};
  return {cls:'',t:'изучается'};
}
function mixLine(cards){
  const n={word:0,gap:0,trans:0}; cards.forEach(c=>n[tOf(c)]++);
  return [n.word&&`${n.word} ${plural(n.word,'слово','слова','слов')}`,n.gap&&`${n.gap} ${plural(n.gap,'пропуск','пропуска','пропусков')}`,n.trans&&`${n.trans} ${plural(n.trans,'перевод','перевода','переводов')}`].filter(Boolean).join(' · ');
}

/* ===================== колоды ===================== */
function getDeck(key){
  const [src,a,b]=key.split(':');
  if(src==='m'){const d=ST.myDecks.find(x=>x.id===a);return d&&{...d,key,source:'mine',editable:true,studiable:true};}
  if(src==='a'){const d=ST.assigned.find(x=>x.id===a);return d&&{...d,cards:d.cards||[],key,source:'teacher',editable:false,studiable:true};}
  if(src==='t'){const d=ST.stuDecks.find(x=>x.id===b);return d&&{...d,cards:d.cards||[],key,sid:a,source:'pupil',editable:true,studiable:false};}
}
const studiableDecks=()=>[...ST.assigned.map(d=>getDeck('a:'+d.id)),...ST.myDecks.map(d=>getDeck('m:'+d.id))].filter(Boolean);
function allWeak(){
  const out=[]; studiableDecks().forEach(dk=>dk.cards.filter(valid).forEach(c=>{const s=sched(dk.key,c.id);if(isWeak(s))out.push({key:dk.key,deck:dk.name,c,s});}));
  return out.sort((a,b)=>(b.s.miss||0)-(a.s.miss||0)||(b.s.lastMiss||0)-(a.s.lastMiss||0));
}

      ['skincare','уход за кожей'],['journal','дневник; вести дневник'],['mindful','осознанный'],['balance','баланс'],['wellbeing','благополучие'],['screen time','время у экрана'],['treat yourself','побаловать себя']],'word'),
    mk('Small changes: Present Simple',[['She [drinks] green tea every morning.','drink'],['I [go] to bed before eleven.','go'],['He [doesn\'t/does not] eat fast food.','отрицание'],

      ['[Does] he drink enough water?','вопрос, 3-е лицо'],['They usually [cook] at home.','cook']],'gap'),

}

async function boot(){
  renderHeader();
  ST.remote=false;
  const [mine,srs,stats,asg,set,reps,gdn]=await Promise.all(['mine','srs','stats','assigned','settings','reports','garden'].map(loadPriv));
  ST.garden=gdn&&Array.isArray(gdn.plants)?gdn:{plants:[],seenT:0};
  ST.myDecks=mine?mine.decks:[]; ST.srs=srs?srs.decks||{}:{}; if(stats) ST.stats=stats;
  ST.assigned=asg?asg.decks||[]:[]; ST.settings=set||{role:'student',name:''}; ST.reports=reps?reps.list||[]:[];
  ST.isTeacher=ST.settings.role==='teacher'; ST.tab=ST.reports.length?'students':'mine';
  if((ST.stats.v||0)<3){ST.myDecks=[...sampleDecks(),...ST.myDecks.filter(d=>!d.sample)];ST.stats.v=3;saveMine();saveStats();}
  ST.ready=true;
  $('#foot').textContent='Колоды и прогресс хранятся в этом браузере. Резервную копию можно сохранить в настройках.';

}
function pushRoster(delay=2500){
  if(!ST.remote||ST.isTeacher||!ST.rosterOk||!ST.myRoster) return;
  queueSet('students/'+ST.myId,()=>ST.myRoster,delay,()=>{ST.rosterOk=false;});
}
function reportProgress(dk){
  if(!dk||dk.source!=='teacher'||!ST.myRoster) return;
  const s=deckStats(dk);
  const weak=dk.cards.map(c=>({id:c.id,s:sched(dk.key,c.id)})).filter(x=>isWeak(x.s)).sort((a,b)=>b.s.miss-a.s.miss).slice(0,40).map(x=>({id:x.id,miss:x.s.miss}));
  ST.myRoster.progress[dk.id]={total:s.all,learned:s.learned,mastered:s.mastered,weak,last:Date.now()};
  ST.myRoster.lastSeen=Date.now(); ST.myRoster.xp=ST.stats.xp; pushRoster();
}
const sortedStudents=()=>ST.students.slice().sort((a,b)=>(a.addedAt||a.joinedAt||0)-(b.addedAt||b.joinedAt||0));
function selectStudent(id,rerender=true){
  if(ST.unsubStu){ST.unsubStu();ST.unsubStu=null;}
  ST.selStu=id; ST.stuDecks=[];
  if(id) ST.unsubStu=ST.db.collection('assigned/'+id+'/decks').onSnapshot(s=>{
    ST.stuDecks=s.docs.map(d=>({id:d.id,...d.data()}));

}
async function fillPeople(){
  if(!ST.user) return;

const modebar=(mode,title)=>`<div class="modebar"><button class="btn quiet" data-act="home">← Назад</button><div class="ttl"><span class="lbl">${mode}</span><h2>${h(title)}</h2></div></div><div id="gslot"></div>`;

    ${assigned?`<div class="decks">${assigned}</div>`:`<div class="empty"><p>Попросите учителя прислать ссылку на колоду и откройте её — задания появятся здесь. Если пришёл код, нажмите «Вставить код».</p></div>`}</section>`;
  return '<div id="gslot"></div>'+weakBox()+teacherSec+gardenStrip()+mineSection();
}


/* ---------- списки слов ---------- */
function wordTable(rows,showDeck){
  if(!rows.length) return `<div class="empty"><p>Под этот фильтр ничего не подходит.</p></div>`;
  return `<div class="tablewrap"><table class="words"><thead><tr><th></th><th>Задание</th><th>Ответ</th><th>Тип</th>${showDeck?'<th>Колода</th>':''}<th>Статус</th></tr></thead><tbody>
    ${rows.map((r,i)=>`<tr class="${r.st&&r.st.cls==='hard'?'is-hard':''}"><td class="num">${i+1}</td>
      <td>${tOf(r.c)==='gap'?fullHTML(r.c):h(r.c.f)}${tOf(r.c)==='gap'&&r.c.b?`<div class="hint">${h(r.c.b)}</div>`:''}</td>
      <td>${tOf(r.c)==='gap'?h(answerText(r.c)):h(tOf(r.c)==='trans'?r.c.b.split('/').map(x=>x.trim()).join(' / '):r.c.b)}</td>
      <td><span class="tb ${tOf(r.c)}-t">${TYPES[tOf(r.c)]}</span></td>
      ${showDeck?`<td>${h(r.deck)}</td>`:''}

  </tbody></table></div>`;
}
function vList(){

      .map(([k,t,n])=>`<button class="btn" data-act="filter" data-f="${k}" aria-pressed="${f===k}">${t} · ${n}</button>`).join('')}

}
function vWeak(){

    <div class="filters">${w.length?`<button class="btn primary" data-act="drill">Тренировать все · ${w.length}</button>`:''}</div>

function saveDraft(){
  const dk=getDeck(V.key); if(!dk) return;
  const d=V.draft; const clean=()=>({name:d.name.trim()||'Без названия',cards:d.cards.filter(c=>c.f.trim()||c.b.trim())});
  if(dk.source==='mine'){const m=ST.myDecks.find(x=>x.id===dk.id);Object.assign(m,clean(),{sample:false});saveMine();}
  else if(dk.source==='pupil'){const created=dk.createdAt||Date.now();
    queueSet(`assigned/${dk.sid}/decks/${dk.id}`,()=>({...clean(),createdAt:created,updatedAt:Date.now()}),700,
      e=>{toast(e&&e.code==='quota_exceeded'?'Хранилище переполнено: удалите старые колоды.':'Не удалось сохранить. Проверьте подключение.');});}
  const el=$('#saved'); if(el) el.textContent='Сохранено';
}

/* ---------- учёба и тренировка трудных ---------- */
function startStudy(key){
  const dk=getDeck(key), now=Date.now(); const cards=dk.cards.filter(valid);
  const due=shuffle(cards.filter(c=>{const s=sched(key,c.id);return !s.n&&s.due<=now})).map(c=>({key,cid:c.id}));
  const nw=cards.filter(c=>sched(key,c.id).n).slice(0,20).map(c=>({key,cid:c.id}));
  go({name:'study',title:dk.name,key,queue:[...due,...nw],shown:false,res:null,ans:'',done:0,again:0,xp:0,total:due.length+nw.length,drill:false,...lifeState()});
}
function startDrill(key){
  const items=(key?allWeak().filter(x=>x.key===key):allWeak()).slice(0,30).map(x=>({key:x.key,cid:x.c.id}));
  go({name:'study',title:key?getDeck(key).name:'Трудные слова',key,queue:shuffle(items),shown:false,res:null,ans:'',done:0,again:0,xp:0,total:items.length,drill:true,requeued:[],...lifeState()});
}
const itemCard=it=>{const dk=getDeck(it.key);return dk&&dk.cards.find(c=>c.id===it.cid);};
const typedLabel=c=>tOf(c)==='gap'?'вставьте пропущенное слово':'переведите на английский';
function verdictHTML(c){
  const t={ok:'Верно',typo:'Почти верно — опечатка',bad:'Неверно'}[V.res];
  return `<div class="verdict ${V.res}"><b>${t}</b>${V.res!=='ok'?`<span class="yours">Ваш ответ: ${V.res==='bad'?'<s>':''}${h(V.ans||'—')}${V.res==='bad'?'</s>':''}</span>`:''}
    <span>Правильно: ${tOf(c)==='gap'?fullHTML(c):h(answerText(c))}</span></div>`;
}
function vStudy(){
  const mode=V.drill?'Тренировка трудных слов':'Учёба · интервальное повторение';
  if(!V.total){
    const dk=V.key?getDeck(V.key):null;
    const nexts=dk?dk.cards.map(c=>sched(V.key,c.id)).filter(s=>!s.n).map(s=>s.due).sort((a,b)=>a-b):[];
    const when=nexts.length?Math.max(1,Math.ceil((nexts[0]-Date.now())/DAY)):null;
    return `${modebar(mode,V.title)}<div class="stage"><div class="leaf result"><span class="fleuron">❦</span><h3>${V.drill?'Трудных слов нет':'Пока нечего повторять'}</h3>
      <p class="muted">${V.drill?'Все ошибки исправлены.':when?`Следующее повторение через ${when} ${plural(when,'день','дня','дней')}. А пока можно пройти тест или пролистать карточки.`:'В колоде нет заданий.'}</p>
      <div class="row"><button class="btn primary" data-act="home">К колодам</button>${dk&&!V.drill?`<button class="btn" data-act="quiz" data-key="${dk.key}">Тест</button>`:''}</div></div></div>`;
  }
  if(!V.queue.length){
    const left=allWeak().length;
    return `${modebar(mode,V.title)}<div class="stage"><div class="leaf result"><span class="fleuron">❦ ❦ ❦</span><h3>${V.drill?'Тренировка окончена':'Урок окончен'}</h3>
      <p class="muted">${V.drill?(left?`В списке трудных осталось ${left}. Слово уходит оттуда после трёх верных ответов подряд — повторите завтра.`:'Список трудных слов пуст.'):'Все задания на сегодня пройдены. Завтра колода напомнит о тех, что пора повторить.'}</p>
      <div class="stats"><div><b>${V.done}</b><span>ответов</span></div><div><b>${V.again}</b><span>ошибок</span></div><div><b>+${V.xp}</b><span>опыта</span></div></div>
      ${rewardHTML()}<div class="row"><button class="btn primary" data-act="home">К колодам</button>${left&&!V.drill?`<button class="btn" data-act="drill">Тренировать трудные · ${left}</button>`:''}</div></div></div>`;
  }
  if(V.over) return fallen(mode,V.title);
  const it=V.queue[0], c=itemCard(it); if(!c){V.queue.shift();return vStudy();}
  const s=sched(it.key,c.id), typed=isTyped(c), dk=getDeck(it.key);
  const tally=V.drill?`<span>Осталось <b>${V.queue.length}</b></span><span>Пройдено <b>${V.done}</b></span>${V.key?'':`<span>${h(dk.name)}</span>`}`
    :(()=>{let nN=0,nR=0;new Set(V.queue.map(q=>q.cid)).forEach(id=>sched(V.key,id).n?nN++:nR++);return `<span class="n">Новые <b>${nN}</b></span><span class="r">Повторить <b>${nR}</b></span><span>Пройдено <b>${V.done}</b></span>`;})();
  let leaf, controls;
  if(typed){
    leaf=`<div class="leaf"><span class="lbl">${typedLabel(c)}${isWeak(s)?' · даётся плохо':''}</span><div class="q ${isLong(c.f)?'long':''}">${frontHTML(c)}</div>
      ${V.res?'':hintArea(c)}</div>`;
    if(!V.res) controls=`<form class="typebox" data-form="check"><input class="f" id="ans" placeholder="${tOf(c)==='gap'?'Пропущенное слово':'Перевод на английский'}" autocomplete="off" autocapitalize="off" spellcheck="false" value="${h(V.ans)}">
      <button class="btn primary" type="submit">Проверить</button></form><div class="answers">${hintBtn()}<button class="btn quiet" data-act="giveup">Не знаю, показать ответ</button></div>`;
    else{
      let btns;
      if(V.drill) btns=`<button class="btn primary" data-act="dnext" data-ok="${V.res==='bad'?0:1}">Дальше <span class="kbd">enter</span></button>${V.res==='bad'&&V.ans?'<button class="btn quiet" data-act="dnext" data-ok="1" data-refund="1">Я ответил верно</button>':''}`;
      else if(V.res==='bad') btns=`<button class="btn g0" data-act="grade" data-g="0">Снова<small>через 1 мин</small><span class="kbd">enter</span></button>${V.ans?`<button class="btn quiet" data-act="grade" data-g="1" data-refund="1">Я ответил верно</button>`:''}`;
      else btns=[1,2,3].map(g=>`<button class="btn g${g}" data-act="grade" data-g="${g}">${['','Трудно','Хорошо','Легко'][g]}<small>через ${fmtIvl(schedule(s,g).ivl)}</small><span class="kbd">${g+1}${g===(V.res==='typo'?1:2)?' · enter':''}</span></button>`).join('');
      controls=verdictHTML(c)+`<div class="answers">${btns}</div>`;
    }
  }else{
    leaf=`<div class="leaf"><span class="lbl">${s.n&&!V.drill?'новое слово':isWeak(s)?'даётся плохо':'повторение'}</span><div class="q ${isLong(c.f)?'long':''}">${h(c.f)}</div>
      ${V.shown?`<span class="fleuron">❦</span><div class="a ${isLong(c.b)?'long':''}">${h(c.b)}</div>`:hintArea(c)}</div>`;
    if(!V.shown) controls=`<div class="answers">${hintBtn()}<button class="btn primary" data-act="show" style="flex:0 1 320px;padding:14px">Показать ответ <span class="kbd">пробел</span></button></div>`;
    else if(V.drill) controls=`<div class="answers"><button class="btn g0" data-act="dnext" data-ok="0">Не помню<span class="kbd">1</span></button><button class="btn g2" data-act="dnext" data-ok="1">Помню<span class="kbd">2</span></button></div>`;
    else controls=`<div class="answers">${['Снова','Трудно','Хорошо','Легко'].map((n,i)=>`<button class="btn g${i}" data-act="grade" data-g="${i}">${n}<small>через ${fmtIvl(schedule(s,i).ivl)}</small><span class="kbd">${i+1}</span></button>`).join('')}</div>`;
  }
  return `${modebar(mode,V.title)}
  <div><div class="progress"><i style="width:${Math.round(V.done/(V.done+V.queue.length)*100)}%"></i></div><div class="tally">${tally}${livesHTML()}</div></div>
  <div class="stage">${leaf}${controls}</div>`;
}
function submitCheck(){
  const it=V.queue[0], c=itemCard(it); const inp=$('#ans'); V.ans=inp?inp.value:'';
  if(!V.ans.trim()){inp&&inp.focus();return;}
  V.res=check(V.ans,c); react(V.res!=='bad',V.res==='typo');
  if(innerWidth<560)afterRender(()=>{const v=$('.verdict');v&&v.scrollIntoView({block:'center',behavior:'smooth'});});
  if(V.res==='bad'){loseLife();afterRender(()=>{boo();pulse('.leaf','hit');});}
  else afterRender(()=>{cheer(0);pulse('.leaf','glow-ok');});
  render();
}
function grade(g){
  const it=V.queue[0]; const old=sched(it.key,it.cid); const typed=!!V.res, at=rectOf('.leaf'); V.say=null;V.mood='';V.lowSay=null; if(!typed)react(g>0);
  srsOf(it.key)[it.cid]={...old,...schedule(old,g)};
  V.queue.shift(); V.done++;
  if(g===0){V.again++;V.queue.push(it);if(!V.res)loseLife();} else gainRun();
  mark(it.key,it.cid,g>0);
  const xp=V.hint?Math.ceil([1,3,5,6][g]/2):[1,3,5,6][g]; V.xp+=xp; addXP(xp);
  if(!typed){g>0?cheer(xp,at):boo(at);} else if(g>0&&at) FX.float('+'+xp,at.x,at.top+10);
  if(V.lives<=0&&V.queue.length) V.over=true;
  V.shown=false; V.res=null; V.ans=''; V.hint=false; render();
}
function drillNext(ok){
  const typed=!!V.res, at=rectOf('.leaf'); V.say=null;V.mood='';V.lowSay=null; if(!typed)react(ok);
  const it=V.queue.shift(); V.done++;
  mark(it.key,it.cid,ok);
  if(!ok){V.again++; if(!V.res)loseLife(); if(!V.requeued.includes(it.cid)){V.requeued.push(it.cid);V.queue.push(it);}}
  else{gainRun();const xp=V.hint?2:4;V.xp+=xp;addXP(xp);if(!typed)cheer(xp,at);else if(at)FX.float('+'+xp,at.x,at.top+10);}
  if(!ok&&!typed) boo(at);
  if(V.lives<=0&&V.queue.length) V.over=true;
  V.shown=false; V.res=null; V.ans=''; V.hint=false; render();
}

/* ---------- карточки ---------- */
function vFlash(){
  const dk=getDeck(V.key); const cards=dk?dk.cards.filter(valid):[]; if(!cards.length) return vHome();
  V.i=Math.min(V.i,V.order.length-1);
  const c=cards.find(x=>x.id===V.order[V.i])||cards[0];
  const t=tOf(c);
  let front,back,fl,bl;
  if(t==='gap'){front=frontHTML(c);back=fullHTML(c)+(c.b?`<p class="hint">${h(c.b)}</p>`:'');fl='вставьте слово';bl='ответ';}
  else if(t==='trans'){front=h(c.f);back=fullHTML(c);fl='переведите';bl='перевод';}
  else{front=h(V.swap?c.b:c.f);back=h(V.swap?c.f:c.b);fl=V.swap?'перевод':'слово';bl=V.swap?'слово':'перевод';}
  const long=isLong(c.f)||isLong(c.b);
  return `${modebar('Карточки',dk.name)}<div class="stage">
    <div class="flip-wrap"><button class="flip ${V.flipped?'is-flipped':''}" id="flipcard" data-act="flip" aria-label="Перевернуть карточку">
      <div class="leaf"><span class="lbl">${fl}</span><div class="q ${long?'long':''}">${front}</div><span class="muted tap-hint">Нажмите, чтобы перевернуть${dk.studiable?'<span class="touch-only"> · свайп вправо — знаю, влево — не знаю</span>':''}</span></div>

    if(tOf(c)==='word'&&words.length>=4){
      const others=shuffle(words.filter(x=>x.id!==c.id&&x.b!==c.b)).slice(0,3).map(x=>x.id);
      if(others.length===3) return {id:c.id,mode:'mc',opts:shuffle([c.id,...others])};
    }
    return {id:c.id,mode:'type'};
  });
  go({name:'quiz',key,qs,i:0,picked:null,res:null,ans:'',score:0,xp:0,wrong:[],...lifeState()});
}

function tile(k){

  const o=V.tiles[V.sel];

  if(o.cid===t.cid){o.gone=t.gone=true;V.sel=null;SND.good();V.say=rnd(['Пара найдена!','Верно!','Так держать!','Ещё одна пара.']);V.mood='happy';[r1,r2].forEach(r=>{if(r){FX.ring(r.x,r.y,'#839958',50);FX.burst(r.x,r.y,{n:26,speed:4.5,colors:['#839958','#b5c77d','#D3968C'],g:.05});}});
    if(V.tiles.every(x=>x.gone)){V.done=true;V.time=(performance.now()-V.start)/1000;clearInterval(timer);
      ST.stats.best=ST.stats.best||{}; const b=ST.stats.best[V.key]; if(!b||V.time<b) ST.stats.best[V.key]=+V.time.toFixed(1); addXP(20);}

/* ===================== обмен по ссылкам (без сервера) ===================== */
async function enc(prefix,obj){
  let bytes=new TextEncoder().encode(JSON.stringify(obj)),v='0';
  if(window.CompressionStream){try{const st=new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));bytes=new Uint8Array(await new Response(st).arrayBuffer());v='1';}catch(e){}}
  let bin='';for(let i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);
  return prefix+v+'.'+btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function dec(text){
  const m=String(text).match(/([DR])([01])\.([A-Za-z0-9_-]{8,})/); if(!m) throw new Error('nocode');
  const b64=m[3].replace(/-/g,'+').replace(/_/g,'/'); const bin=atob(b64+'==='.slice((b64.length+3)%4));
  let bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  if(m[2]==='1'){if(!window.DecompressionStream)throw new Error('old');const st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));bytes=new Uint8Array(await new Response(st).arrayBuffer());}
  return {kind:m[1],data:JSON.parse(new TextDecoder().decode(bytes))};
}

}

function ensurePlant(){
  if(V.planted!==undefined) return V.planted;
  let n=0,acc=0;
  if(V.name==='study'){n=V.done;acc=n?(n-V.again)/n:0;}
  else if(V.name==='quiz'){n=V.qs.length;acc=n?V.score/n:0;}
  else if(V.name==='match'){n=V.tiles.length/2;acc=V.mistakes===0?1:Math.max(0,1-V.mistakes/n);}
  if(n<3){V.planted=null;return null;}
  const tier=acc>=1?'rare':acc>=.7?'flower':'sprout', list=TIERS[tier];
  const p={id:uid(),type:list[Math.floor(Math.random()*list.length)],v:Math.floor(Math.random()*3),t:Date.now(),acc:Math.round(acc*100)};
  ST.garden.plants.push(p); if(ST.garden.plants.length>400) ST.garden.plants.shift(); saveGarden();
  V.planted=p; return p;
}
function rewardHTML(){
  const p=ensurePlant(); if(!p) return '';
  const info=PLANTS[p.type], rare=info.tier==='rare';
  return `<div class="reward"><svg class="reward-plant" viewBox="-34 -78 68 84" aria-hidden="true"><g class="pl-grow">${plantSVG(p)}</g></svg>
    <p>На поляне ${GROW[info.g]} <b>${info.name}</b>${rare?' — за урок без ошибок!':info.tier==='sprout'?'. Без ошибок вырастет дерево или пион.':'.'}</p>
    <button class="btn" data-act="garden">На поляну</button></div>`;
}
function meadowSVG(plants,{cols=8,newSince=0,mini=false}={}){
  const W=600, IH=W*1152/1365, CROP=mini?0:150, cell=W/cols, top=mini?18:370-CROP, rowH=mini?0:66, rows=mini?1:Math.max(3,Math.ceil(plants.length/cols)), H=mini?112:top+rows*rowH+60;
  const rr=hashRng('meadow'+cols+rows);
  let g=`<rect width="${W}" height="${H}" fill="#b5c47d"/><image href="${window.BGIMG||''}" x="0" y="${mini?(112-IH).toFixed(1):-CROP}" width="${W}" height="${IH.toFixed(1)}" preserveAspectRatio="none"/>`;
  if(!mini) for(let i=0;i<rows*7;i++){const x=rr()*W,y=IH-CROP+6+rr()*(H-IH+CROP-10);if(y>H-4)continue;g+=`<path d="M${x.toFixed(0)} ${y.toFixed(0)} l-2 -5 M${x.toFixed(0)} ${y.toFixed(0)} l0 -6 M${x.toFixed(0)} ${y.toFixed(0)} l2 -5" stroke="#97ad66" stroke-width="1.2" stroke-linecap="round"/>`;}
  const placed=plants.map((p,i)=>{const r=hashRng(p.id);
    if(mini) return {p,x:W/2-(plants.length-1)*27+i*54,y:100};
    const row=Math.floor(i/cols),col=i%cols;return {p,x:Math.min(W-44,Math.max(44,cell*(col+.5)+(row%2?cell*.22:-cell*.08)+(r()-.5)*cell*.3)),y:top+70+row*rowH+(r()-.5)*14};});
  placed.sort((a,b)=>a.y-b.y).forEach(({p,x,y},k)=>{x=+x;
    const fresh=p.t>newSince&&!mini, rt=hashRng(p.id+'s');
    const tf={sakura:1.75,olive:1.75,peony:1.2,sprout:.8,mushroom:.8}[p.type]||.85, sc=mini?.9*(tf>1.5?1.15:tf):1.25*tf;
    if(!mini) x=Math.min(W-26*sc,Math.max(26*sc,x));
    g+=`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${sc.toFixed(2)})"><title>${plantTitle(p)}</title><g class="pl-sway" style="animation-delay:-${(rt()*5).toFixed(2)}s"><g class="${fresh?'pl-grow':''}" ${fresh?`data-fresh="1" style="animation-delay:${(k*0.04).toFixed(2)}s"`:''}>${plantSVG(p)}</g></g></g>`;
  });
  if(!mini&&!reduceMotion){const n=Math.min(6,Math.floor(plants.length/5));
    for(let i=0;i<n;i++){const r=hashRng('b'+i),c=['#D3968C','#e8b84a','#9b8bc7','#6f9fd1'][i%4];
      const pts=Array.from({length:4},()=>`${(40+r()*(W-80)).toFixed(0)} ${(top+r()*(H-top-30)).toFixed(0)}`);
      g+=`<g><g transform="scale(1.3)"><g><path d="M0 0 Q-7 -8 -9 -1 Q-7 4 0 0Z M0 0 Q7 -8 9 -1 Q7 4 0 0Z" fill="${c}"/><path d="M0 -3 V3" stroke="#3b2a20" stroke-width="1.2"/>
        <animateTransform attributeName="transform" type="scale" values="1 1;.25 1;1 1" dur="${(.3+r()*.15).toFixed(2)}s" repeatCount="indefinite"/></g></g>
        <animateMotion dur="${(16+r()*10).toFixed(1)}s" repeatCount="indefinite" rotate="0" path="M${pts[0]} Q${pts[1]} ${pts[2]} T${pts[3]} T${pts[0]}"/></g>`;}}
  if(!plants.length&&!mini) g+=`<g transform="translate(${W/2} ${top+70})"><rect x="-150" y="-26" width="300" height="52" rx="26" fill="#FFFDF2" stroke="rgba(10,51,35,.14)"/><text x="0" y="6" text-anchor="middle" font-family="Manrope, sans-serif" font-size="15" font-weight="700" fill="#0A3323">Пройди урок — появится первый росток</text></g>`;
  return `<svg class="meadow" viewBox="0 0 ${W} ${H}" role="img" aria-label="Поляна: ${plants.length} ${plural(plants.length,'растение','растения','растений')}">${g}</svg>`;
}

function bulkAdd(){
  const t=V.bulkType||'word'; const seps=['\t',' — ',' – ',' - ','—','–',';'];let n=0,bad=0;
  $('#bulk').value.split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{
    const s=seps.find(x=>l.includes(x));
    let f=l,bk='';
    if(s){const i=l.indexOf(s);f=l.slice(0,i).trim();bk=l.slice(i+s.length).trim();}
    if(t==='gap'){if(!groups(f).length){bad++;return;}}
    else if(!f||!bk){bad++;return;}
    V.draft.cards.push(mkCard(f,bk,t));n++;});
  V.draft.cards=V.draft.cards.filter(c=>c.f||c.b);
  if(n){saveDraft();render();toast(`Добавлено заданий: ${n}`);}
  if(bad){const el=$('#bulk-err');el.hidden=false;el.textContent=t==='gap'?`Не разобрано строк: ${bad}. В каждом предложении пропуск должен быть в [квадратных скобках].`:`Не разобрано строк: ${bad}. Разделите задание и ответ тире, «;» или табуляцией.`;}
}

function flip(){V.flipped=!V.flipped;$('#flipcard')?.classList.toggle('is-flipped',V.flipped);SND.flip();const r=rectOf('#flipcard');if(r)FX.burst(r.x,r.y,{n:16,speed:3.2,g:0,drag:.92,colors:['#b5c77d','#839958']});}
function fmove(d){V.i=(V.i+d+V.order.length)%V.order.length;V.flipped=false;render();}

  if(t.id==='stu-search'){
    const hits=await ST.user.search(t.value.trim()); const box=$('#hits'); if(!box) return;

  clearTimeout(edT); edT=setTimeout(saveDraft,500);

    if(e.key===' '&&clickBtn('[data-act="show"]')) return;
    if(e.key==='Enter'){ if(V.res){ if(V.drill) clickBtn('[data-act="dnext"]'); else if(V.res==='bad') clickBtn('[data-g="0"]'); else clickBtn(`[data-g="${V.res==='typo'?1:2}"]`); } else clickBtn('[data-act="show"]'); return; }
    if(/^[1-4]$/.test(e.key)){ if(V.drill&&!V.res){clickBtn(`[data-act="dnext"][data-ok="${e.key==='1'?0:1}"]`);} else clickBtn(`[data-act="grade"][data-g="${+e.key-1}"]`); }
  }else if(V.name==='flash'){
    if(e.key===' '){e.preventDefault();flip();} else if(e.key==='ArrowRight')fmove(1); else if(e.key==='ArrowLeft')fmove(-1);
    else if(e.key==='1')clickBtn('[data-act="know"][data-ok="0"]'); else if(e.key==='2')clickBtn('[data-act="know"][data-ok="1"]');
  }else if(V.name==='quiz'&&V.i<V.qs.length){
    const q=V.qs[V.i];
    if(q.mode==='mc'&&!V.picked&&/^[1-4]$/.test(e.key)&&q.opts[+e.key-1]) pick(q.opts[+e.key-1]);
    else if(e.key==='Enter') clickBtn('[data-act="qnext"]');
  }
});

(function(){const m=$('#motes');if(!m)return;for(let i=0;i<18;i++){const e=document.createElement('i');e.style.left=(Math.random()*100)+'%';e.style.animationDuration=(14+Math.random()*16)+'s';e.style.animationDelay=(-Math.random()*25)+'s';e.style.setProperty('--dx',(Math.random()*80-40)+'px');if(i%3===0){e.style.background='#a9bc72';}e.style.transform='scale('+(0.7+Math.random()*0.8)+')';m.appendChild(e);}})();
document.addEventListener('pointerdown',()=>SND.unlock(),{passive:true});
document.addEventListener('touchend',()=>SND.unlock(),{passive:true});
/* свайпы по карточке: вправо — «знаю», влево — «не знаю» */
let SW=null, swallow=false;
document.addEventListener('pointerdown',e=>{const f=e.target.closest('#flipcard');if(!f||V.name!=='flash')return;SW={x:e.clientX,y:e.clientY,id:e.pointerId,moved:false};},{passive:true});
document.addEventListener('pointermove',e=>{if(!SW||e.pointerId!==SW.id)return;const dx=e.clientX-SW.x,dy=e.clientY-SW.y;
  if(!SW.moved&&Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy))SW.moved=true;
  if(SW.moved){const w=$('.flip-wrap');if(w){w.style.transition='none';w.style.transform=`translateX(${dx}px) rotate(${dx/22}deg)`;w.dataset.dir=dx>40?'yes':dx<-40?'no':'';}}},{passive:true});
function endSwipe(e){if(!SW||e.pointerId!==SW.id)return;const dx=e.clientX-SW.x,moved=SW.moved;SW=null;const w=$('.flip-wrap');
  if(w){w.style.transition='transform .25s ease';w.style.transform='';w.dataset.dir='';}
  if(moved){swallow=true;setTimeout(()=>swallow=false,50);const dk=getDeck(V.key);if(Math.abs(dx)>80&&dk&&dk.studiable)know(dx>0);}}
document.addEventListener('pointerup',endSwipe,{passive:true});document.addEventListener('pointercancel',endSwipe,{passive:true});
FX.init();
boot();

</script>
