<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0c14">
<meta name="description" content="Карточки и упражнения по английскому: интервальное повторение, тесты, игры и задания от учителя.">
<title>Скрипторий</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='22' fill='%231b2742' stroke='%23f0c26a' stroke-width='2'/%3E%3Cpath d='M15 31 L24 13 L33 31 M18.5 25 H29.5' fill='none' stroke='%23f0c26a' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans+SC:wght@500;700&display=swap">
<style>
/* Layout: замок на закате как фон всей страницы; поверх — тёмные «каменные» панели с позолоченной кромкой, режимы учёбы — одна светящаяся карта по центру */
:root{
  --night:#0d0c14; --stone:rgba(20,18,28,.78); --stone-solid:#1a1722; --stone-2:rgba(38,33,48,.82); --edge:rgba(232,186,104,.32); --edge-strong:rgba(240,196,110,.7);
  --ivory:#f4e8cc; --ivory-2:#c9b896; --gold:#f0c26a; --gold-deep:#b9842f; --sky:#93bbff; --ember:#e45a43; --moss:#8fc79a;
  --glow:0 0 0 1px rgba(240,196,110,.12), 0 18px 40px -18px rgba(0,0,0,.9), 0 0 60px -30px rgba(240,180,90,.5);
  --f-display:"Cormorant Garamond", "Georgia", "Times New Roman", serif;
  --f-body:"Alegreya", "Georgia", serif;
  --f-label:"Alegreya Sans SC", "Trebuchet MS", system-ui, sans-serif;
  color-scheme:dark;
}
html{background:var(--night);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--night);color:var(--ivory);font-family:var(--f-body);font-size:17px;line-height:1.5;position:relative;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:0;background:var(--night) var(--castle) center 18%/cover no-repeat;animation:breathe 14s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.03);filter:brightness(1.06) saturate(1.08)}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:45;pointer-events:none}
#flash{position:fixed;inset:0;z-index:44;pointer-events:none;opacity:0}
#flash.hurt{background:radial-gradient(ellipse at center,transparent 45%,rgba(228,90,67,.38));animation:flash .55s ease-out}
#flash.fallen{background:radial-gradient(ellipse at center,rgba(40,0,0,.25),rgba(130,20,10,.6));animation:flash 1.5s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.floater{position:fixed;z-index:46;pointer-events:none;font-family:var(--f-display);font-weight:700;font-size:30px;color:var(--gold);
  text-shadow:0 0 14px rgba(240,194,106,.85),0 2px 0 rgba(0,0,0,.6);animation:floatup 1.25s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-70%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-240%) scale(1)}}
.leaf.glow-ok,.opt.ok{animation:glowok .9s ease-out}
@keyframes glowok{0%{box-shadow:0 0 0 0 rgba(143,199,154,.85),var(--glow)}100%{box-shadow:0 0 0 28px rgba(143,199,154,0),var(--glow)}}
.leaf.hit{animation:hit .45s}
@keyframes hit{0%{border-color:var(--ember)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}100%{transform:none}}
.reveal{animation:reveal .55s ease-out}
@keyframes reveal{from{opacity:0;transform:translateY(10px) scale(.96);filter:blur(5px)}}
#app.enter{animation:enter .45s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(12px)}}
.deck{position:relative;overflow:hidden}
.deck::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 35%,rgba(255,222,160,.15) 50%,transparent 65%);transform:translateX(-120%);transition:transform .8s ease}
.deck:hover::after{transform:translateX(120%)}
.tile:active,.opt:active{transform:scale(.97)}
.sndbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--edge-strong);background:transparent;color:var(--gold);cursor:pointer;display:grid;place-items:center;flex:none}
.sndbtn svg{width:20px;height:20px}
.sndbtn[aria-pressed="false"]{color:var(--ivory-2);border-color:var(--edge)}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg, rgba(12,10,26,.15) 0%, rgba(12,10,26,.38) 28%, rgba(10,8,20,.82) 56%, rgba(8,7,14,.94) 100%),
             radial-gradient(ellipse at 50% 12%, rgba(130,170,255,.16), transparent 50%)}
.motes{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.motes i{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:50%;background:#ffd99a;box-shadow:0 0 8px 2px rgba(255,200,120,.6);opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:.8}90%{opacity:.6}100%{transform:translate(var(--dx,20px),-105vh);opacity:0}}
.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 64px;display:flex;flex-direction:column;gap:30px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.1;text-wrap:balance;margin:0}
.lbl{font-family:var(--f-label);font-size:13px;letter-spacing:.08em;color:var(--gold)}
.muted{color:var(--ivory-2);font-size:15px;margin:0}
.err{color:var(--ember);font-size:15px;margin:0}

/* header: над панелями остаётся видна вершина замка */
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;padding-top:clamp(90px,18vw,170px);padding-bottom:18px;
  border-bottom:1px solid var(--edge)}
.brand{display:flex;align-items:center;gap:14px}
.brand .seal{width:52px;height:52px;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
.brand h1{font-size:clamp(38px,7vw,64px);letter-spacing:.02em;color:var(--ivory);text-shadow:0 2px 0 rgba(0,0,0,.5),0 0 30px rgba(255,200,120,.35)}
.brand h1 b{color:var(--gold);font-weight:700}
.brand p{margin:2px 0 0;font-size:16px;color:var(--ivory);font-style:italic;text-shadow:0 1px 6px rgba(0,0,0,.9)}
.player{display:flex;align-items:center;gap:22px;flex-wrap:wrap;background:var(--stone);border:1px solid var(--edge);border-radius:4px;padding:10px 16px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.role{font-family:var(--f-label);font-size:13px;letter-spacing:.08em;padding:3px 10px;border:1px solid var(--edge-strong);color:var(--gold);border-radius:2px}
.rank{display:flex;flex-direction:column;gap:5px;min-width:170px}
.rank .t{font-family:var(--f-display);font-size:20px;font-weight:700;color:var(--ivory)}
.bar{height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-deep),var(--gold))}
.rank .s{font-size:13px;color:var(--ivory-2);font-variant-numeric:tabular-nums}
.streak{display:flex;align-items:baseline;gap:6px}
.streak b{font-family:var(--f-display);font-size:30px;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1}
.streak span{font-size:13px;color:var(--ivory-2);line-height:1.2}

/* buttons */
.btn{font-family:var(--f-label);font-size:15px;letter-spacing:.05em;border:1px solid var(--edge-strong);background:rgba(20,18,28,.6);color:var(--ivory);
  padding:9px 16px 10px;border-radius:3px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;transition:background .15s,color .15s,transform .1s,box-shadow .15s}
.btn:hover{background:rgba(240,194,106,.12);box-shadow:0 0 18px -6px rgba(240,194,106,.6)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,#f6d38b,#c99240);border-color:#f8dc9c;color:#22170b;box-shadow:0 0 22px -8px rgba(240,190,100,.8), inset 0 1px 0 rgba(255,255,255,.5)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{border-color:var(--ember);color:#ffb3a5}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ivory-2)}
.btn.quiet:hover{color:var(--ivory);background:rgba(255,255,255,.05)}
.btn[disabled]{opacity:.38;cursor:not-allowed;box-shadow:none}
.btn small{font-family:var(--f-body);font-size:13px;letter-spacing:0;opacity:.85}
.btn.hintbtn{border-color:var(--sky);color:var(--sky);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 22px -4px rgba(157,192,227,.8)}}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

.tabs{display:flex;gap:6px;border-bottom:1px solid var(--edge);flex-wrap:wrap}
.tab{font-family:var(--f-label);font-size:17px;letter-spacing:.06em;background:none;border:0;border-bottom:2px solid transparent;color:var(--ivory-2);padding:8px 14px 10px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--gold);border-color:var(--gold)}

.sec{display:flex;flex-direction:column;gap:18px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap}
.sec-head h2{font-size:32px;color:var(--ivory)}
.sec-head h2 em{font-style:normal;color:var(--gold)}
.sec-head .row{display:flex;gap:10px;flex-wrap:wrap}
.notice{background:var(--stone);border:1px solid var(--edge);border-left:3px solid var(--gold);padding:14px 18px;border-radius:3px;max-width:75ch;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.notice p{margin:0}

.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:22px}
.deck,.panel,.stulist,.weakbox,.tablewrap,.empty,.verdict,.leaf{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.deck{background:var(--stone);border:1px solid var(--edge);border-radius:4px;box-shadow:var(--glow);padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px;min-width:0;transition:transform .2s,border-color .2s}
.deck:hover{transform:translateY(-2px);border-color:var(--edge-strong)}
.deck .head{display:flex;gap:14px;align-items:flex-start;min-width:0}
.initial{flex:none;width:56px;height:56px;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#3d5c8c,#1b2742);color:var(--gold);
  font-family:var(--f-display);font-size:38px;font-weight:700;line-height:1;border:1px solid var(--gold);outline:1px solid rgba(240,194,106,.4);outline-offset:3px;border-radius:2px;text-shadow:0 0 12px rgba(240,194,106,.6)}
.deck.teacher .initial{background:radial-gradient(circle at 35% 30%,#8a3a2c,#3a1611)}
.deck h3{font-size:25px;overflow-wrap:anywhere;color:var(--ivory)}
.deck .from{font-family:var(--f-label);font-size:12px;letter-spacing:.07em;color:var(--gold);display:block;margin-top:4px}
.counts{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--ivory-2);font-variant-numeric:tabular-nums}
.counts b{font-family:var(--f-display);font-size:23px;color:var(--ivory);margin-right:3px}
.counts .due b{color:var(--ember)} .counts .new b{color:var(--sky)}
.deck .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:12px;border-top:1px solid var(--edge)}
.deck .acts .btn.primary{flex:1 1 100%}
.empty{background:rgba(20,18,28,.55);border:1px dashed var(--edge);border-radius:4px;padding:26px;text-align:center;color:var(--ivory-2)}
.empty p{margin:0 auto;max-width:52ch}

.tgrid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:28px;align-items:start}
.stulist{background:var(--stone);border:1px solid var(--edge);border-radius:4px;display:flex;flex-direction:column}
.stulist .add{padding:14px;border-bottom:1px solid var(--edge);position:relative;display:flex;flex-direction:column;gap:8px}
.stu{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;background:none;text-align:left;cursor:pointer;color:var(--ivory);font:inherit;border-bottom:1px solid var(--edge);width:100%}
.stu:last-child{border-bottom:0}
.stu:hover{background:rgba(240,194,106,.08)}
.stu[aria-current="true"]{background:rgba(240,194,106,.1);box-shadow:inset 3px 0 0 var(--gold)}
.stu img{width:34px;height:34px;border-radius:50%;flex:none;background:var(--stone-2)}
.stu .nm{font-weight:500;overflow-wrap:anywhere}
.stu .meta{font-size:13px;color:var(--ivory-2)}
.stu > div{min-width:0}
.hits{position:absolute;left:14px;right:14px;top:calc(100% - 6px);background:var(--stone-solid);border:1px solid var(--edge);border-radius:4px;box-shadow:var(--glow);z-index:5;max-height:300px;overflow:auto}
.pupil{display:flex;flex-direction:column;gap:20px;min-width:0}
.pupil-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pupil-head img{width:52px;height:52px;border-radius:50%;border:1px solid var(--edge-strong)}
.pupil-head h2{font-size:32px;overflow-wrap:anywhere}
.pupil-head > div{flex:1;min-width:0}
.prog-line{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ivory-2);font-variant-numeric:tabular-nums}
.prog-line .bar{flex:1;min-width:60px}
.prog-line .bar i{background:linear-gradient(90deg,#4f8f63,var(--moss))}

input.f,textarea.f,select.f{font-family:var(--f-body);font-size:17px;color:var(--ivory);background:rgba(8,7,12,.6);border:1px solid var(--edge);border-radius:3px;padding:9px 11px;width:100%;resize:vertical}
input.f::placeholder,textarea.f::placeholder{color:rgba(201,184,150,.55)}
input.f:focus,textarea.f:focus,select.f:focus{border-color:var(--gold);outline:2px solid rgba(240,194,106,.25);outline-offset:0}
select.f option{background:var(--stone-solid);color:var(--ivory)}
label.fl{display:flex;flex-direction:column;gap:6px}
.ed-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:26px;align-items:start}
.panel{background:var(--stone);border:1px solid var(--edge);border-radius:4px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h3{font-size:24px}
.cardrow{display:grid;grid-template-columns:26px 112px minmax(0,1fr) minmax(0,1fr) 34px;gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--edge)}
.colheads{display:grid;grid-template-columns:26px 112px minmax(0,1fr) minmax(0,1fr) 34px;gap:10px}
.cardrow .num{font-family:var(--f-display);font-size:18px;color:var(--gold);padding-top:8px;text-align:right;font-variant-numeric:tabular-nums}
.cardrow select.f{font-size:15px;padding:9px 6px}
.rownote{grid-column:3 / 5;font-size:13px;color:var(--ember);margin:-4px 0 0}
.x{background:none;border:0;color:var(--ivory-2);font-size:22px;line-height:1;cursor:pointer;padding:8px 4px;border-radius:3px}
.x:hover{color:var(--ember)}
.saved{font-size:13px;color:var(--ivory-2);font-style:italic}

.modebar{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.modebar .ttl{flex:1;min-width:0}
.modebar h2{font-size:34px;overflow-wrap:anywhere;text-shadow:0 2px 10px rgba(0,0,0,.7)}
.progress{height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-deep),var(--gold));transition:width .25s;box-shadow:0 0 10px rgba(240,194,106,.7)}
.tally{display:flex;gap:20px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--ivory-2);margin-top:10px;font-variant-numeric:tabular-nums}
.tally b{color:var(--ivory)} .tally .n b{color:var(--sky)} .tally .r b{color:var(--ember)}
.lives{display:inline-flex;gap:4px;align-items:center;margin-left:auto}
.heart{width:24px;height:22px;fill:var(--ember);stroke:#ffcf8a;stroke-width:1.1;filter:drop-shadow(0 0 6px rgba(228,90,67,.7));transition:fill .3s}
.heart.lost{fill:rgba(255,255,255,.04);stroke:rgba(244,232,204,.3);filter:none}
.heart.drop{animation:drop .6s ease-out}
.heart.gain{animation:gain .6s ease-out}
@keyframes drop{0%{transform:scale(1.3);fill:var(--ember)}40%{transform:translateY(-4px) rotate(-12deg)}100%{transform:none}}
@keyframes gain{0%{transform:scale(.4)}60%{transform:scale(1.35)}100%{transform:none}}
.lives.low .heart:not(.lost){animation:beat 1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}

.stage{display:flex;flex-direction:column;align-items:center;gap:24px}
.leaf{width:100%;max-width:680px;min-height:290px;background:linear-gradient(180deg,rgba(46,38,52,.86),rgba(18,16,24,.9));border:1px solid var(--edge-strong);box-shadow:var(--glow),inset 0 1px 0 rgba(255,220,160,.25);border-radius:4px;
  padding:42px 34px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;position:relative}
.leaf::before{content:"";position:absolute;inset:9px;border:1px solid rgba(240,194,106,.2);pointer-events:none;border-radius:2px}
.leaf::after{content:"";position:absolute;left:50%;top:-1px;width:40%;height:1px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,#ffe2a6,transparent)}
.leaf .q,.leaf .a{font-family:var(--f-display);font-size:clamp(30px,5vw,44px);font-weight:600;line-height:1.15;overflow-wrap:anywhere;text-wrap:balance;color:var(--ivory)}
.leaf .a{color:var(--gold);text-shadow:0 0 22px rgba(240,194,106,.35)}
.leaf .q.long,.leaf .a.long{font-size:clamp(23px,3.6vw,31px);line-height:1.3}
.fleuron{color:var(--gold);font-size:20px;letter-spacing:.6em;margin-right:-.6em}
.answers{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:100%;max-width:680px}
.answers .btn{flex:1 1 130px;flex-direction:column;gap:2px;padding:12px}
.g0{border-color:var(--ember);color:#ffb3a5} .g1{border-color:#d9a24a;color:#f4cf8a}
.g2{border-color:var(--moss);color:var(--moss)} .g3{border-color:var(--sky);color:var(--sky)}
.kbd{font-family:var(--f-body);font-size:12px;opacity:.6;letter-spacing:0}
.hint{font-style:italic;color:var(--sky);font-size:17px;margin:0;max-width:52ch}
.hintbox{border-top:1px dashed rgba(157,192,227,.4);padding-top:12px;margin-top:2px;animation:fadein .4s}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}}

.result{max-width:600px;width:100%;text-align:center;align-items:center}
.result h3{font-size:38px}
.result .stats{display:flex;gap:30px;justify-content:center;flex-wrap:wrap}
.result .stats div{display:flex;flex-direction:column}
.result .stats b{font-family:var(--f-display);font-size:36px;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.1}
.result .stats span{font-size:14px;color:var(--ivory-2)}
.result .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.result.fallen{border-color:rgba(228,90,67,.6)}
.result.fallen h3{color:#ffb3a5}

.flip-wrap{width:100%;max-width:680px;perspective:1400px}
.flip{display:block;width:100%;min-height:310px;position:relative;border:0;padding:0;background:none;cursor:pointer;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.25,.5,1);font:inherit;color:inherit}
.flip.is-flipped{transform:rotateY(180deg)}
.flip .leaf{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;max-width:none;backdrop-filter:none;-webkit-backdrop-filter:none;background:linear-gradient(180deg,#2c2533,#16131c)}
.flip .leaf.back{transform:rotateY(180deg);background:linear-gradient(180deg,#2f2a22,#17140f)}
.navrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.navrow .pos{font-family:var(--f-display);font-size:24px;min-width:80px;text-align:center;font-variant-numeric:tabular-nums}
.knowrow .btn{min-width:140px}

.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:100%;max-width:680px}

<script>
const $=s=>document.querySelector(s);

const clone=o=>JSON.parse(JSON.stringify(o));

function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;$('#toasts').appendChild(el);setTimeout(()=>el.remove(),2500);}

/* ===================== типы карточек ===================== */
const TYPES={word:'Слово',gap:'Пропуск',trans:'Перевод'};
const tOf=c=>c.t||'word';
const groups=f=>[...String(f||'').matchAll(/\[([^\]]+)\]/g)].map(m=>m[1]);

const firstAlt=g=>g.split('/')[0].trim();

function fullHTML(c){
  if(tOf(c)==='gap') return h(c.f).replace(/\[([^\]]+)\]/g,(m,g)=>`<mark class="ans">${g.split('/').map(x=>x.trim()).join(' / ')}</mark>`);

  if(tOf(c)==='gap'){let out=[''];for(const g of groups(c.f)){const alts=g.split('/').map(x=>x.trim());const nx=[];for(const o of out)for(const a of alts)nx.push((o+' '+a).trim());out=nx.slice(0,64);}return out;}
  if(tOf(c)==='trans') return c.b.split('/');
  return [c.b,...c.b.split(/[\/,;]/)];
}
function norm(s){
  return String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/ё/g,'е')
    .replace(/\b(do|does|did|is|are|was|were|have|has|had|could|would|should|need)nt\b/g,"$1n't").replace(/\bdont\b/g,"don't").replace(/\bcant\b/g,"can't").replace(/\bwont\b/g,"won't").replace(/\bim\b/g,"i'm")
    .replace(/\bcan't\b|\bcannot\b/g,'can not').replace(/\bwon't\b/g,'will not').replace(/n't\b/g,' not')
    .replace(/'m\b/g,' am').replace(/'re\b/g,' are').replace(/'ve\b/g,' have').replace(/'ll\b/g,' will').replace(/'d\b/g,' would')
    .replace(/\b(it|he|she|that|what|where|who|there|here|how)'s\b/g,'$1 is')

function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){const q=[i];for(let j=1;j<=n;j++)q[j]=Math.min(p[j]+1,q[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=q;}return p[n];}

  const acc=accepted(c).map(norm).filter(Boolean);

/* ===================== эффекты: частицы ===================== */

function deckStats(dk){
  const now=Date.now();let due=0,nw=0,learned=0,mastered=0,weak=0;
  dk.cards.filter(valid).forEach(c=>{const s=sched(dk.key,c.id);if(isWeak(s))weak++;if(s.n)nw++;else{learned++;if(s.due<=now)due++;if(s.ivl>=21)mastered++;}});
  return {due,nw,learned,mastered,weak,all:dk.cards.filter(valid).length};
}
function statusOf(key,c){
  const s=sched(key,c.id);
  if(isWeak(s)) return {cls:'hard',t:'даётся плохо',miss:s.miss};
  if(s.n) return {cls:'new',t:'новое'};
  if(s.ivl>=21) return {cls:'master',t:'закреплено'};
  return {cls:'',t:'изучается'};
}
function mixLine(cards){
  const n={word:0,gap:0,trans:0}; cards.forEach(c=>n[tOf(c)]++);
  return [n.word&&`${n.word} ${plural(n.word,'слово','слова','слов')}`,n.gap&&`${n.gap} ${plural(n.gap,'пропуск','пропуска','пропусков')}`,n.trans&&`${n.trans} ${plural(n.trans,'перевод','перевода','переводов')}`].filter(Boolean).join(' · ');
}

/* ===================== колоды ===================== */
function getDeck(key){
  const [src,a,b]=key.split(':');
  if(src==='m'){const d=ST.myDecks.find(x=>x.id===a);return d&&{...d,key,source:'mine',editable:true,studiable:true};}
  if(src==='a'){const d=ST.assigned.find(x=>x.id===a);return d&&{...d,cards:d.cards||[],key,source:'teacher',editable:false,studiable:true};}
  if(src==='t'){const d=ST.stuDecks.find(x=>x.id===b);return d&&{...d,cards:d.cards||[],key,sid:a,source:'pupil',editable:true,studiable:false};}
}
const studiableDecks=()=>[...ST.assigned.map(d=>getDeck('a:'+d.id)),...ST.myDecks.map(d=>getDeck('m:'+d.id))].filter(Boolean);
function allWeak(){
  const out=[]; studiableDecks().forEach(dk=>dk.cards.filter(valid).forEach(c=>{const s=sched(dk.key,c.id);if(isWeak(s))out.push({key:dk.key,deck:dk.name,c,s});}));
  return out.sort((a,b)=>(b.s.miss||0)-(a.s.miss||0)||(b.s.lastMiss||0)-(a.s.lastMiss||0));
}
function sampleDecks(){
  const mk=(name,pairs,t)=>({id:uid(),name,sample:true,cards:pairs.map(p=>mkCard(p[0],p[1]||'',t))});
  return [
    mk('English: Present Simple',[['She [is] a doctor.','to be'],['They [are] at home now.','to be'],['My brother [works] in a bank.','work'],
      ['He [doesn\'t/does not] like coffee.','отрицание'],['[Do] you speak English?','вопрос'],['We usually [have] lunch at one o\'clock.','have'],
      ['Water [boils] at 100 degrees.','boil'],['[Does] your sister live in London?','вопрос, 3-е лицо']],'gap'),
    mk('English: перевод фраз',[['Я живу в большом городе.','I live in a big city. / I live in a large city.'],
      ['Мой брат старше меня.','My brother is older than me. / My brother is older than I am.'],
      ['Где ближайшая аптека?','Where is the nearest pharmacy? / Where is the nearest chemist? / Where is the nearest drugstore?'],
      ['Я не люблю рано вставать.','I don\'t like getting up early. / I don\'t like to get up early.'],
      ['Сколько это стоит?','How much is it? / How much does it cost? / How much is this? / How much does this cost?'],
      ['Вчера шёл дождь.','It rained yesterday. / It was raining yesterday.']],'trans'),
    mk('English: в путешествии',[['ticket','билет'],['luggage','багаж'],['departure','отправление'],['arrival','прибытие'],['platform','платформа'],
      ['delay','задержка'],['passport','паспорт'],['boarding pass','посадочный талон'],['customs','таможня'],['sightseeing','осмотр достопримечательностей']],'word'),
  ];
}

/* ===================== запуск ===================== */
async function boot(){
  renderHeader();
  ST.remote=false;
  const [mine,srs,stats,asg,set,reps]=await Promise.all(['mine','srs','stats','assigned','settings','reports'].map(loadPriv));
  ST.myDecks=mine?mine.decks:[]; ST.srs=srs?srs.decks||{}:{}; if(stats) ST.stats=stats;
  ST.assigned=asg?asg.decks||[]:[]; ST.settings=set||{role:'student',name:''}; ST.reports=reps?reps.list||[]:[];
  ST.isTeacher=ST.settings.role==='teacher'; ST.tab=ST.reports.length?'students':'mine';
  if((ST.stats.v||0)<2){ST.myDecks=[...sampleDecks(),...ST.myDecks];ST.stats.v=2;saveMine();saveStats();}
  ST.ready=true;
  $('#foot').textContent='Колоды и прогресс хранятся в этом браузере. Резервную копию можно сохранить в настройках.';
  renderHeader(); render(); handleHash();
}
function pushRoster(delay=2500){
  if(!ST.remote||ST.isTeacher||!ST.rosterOk||!ST.myRoster) return;
  queueSet('students/'+ST.myId,()=>ST.myRoster,delay,()=>{ST.rosterOk=false;});
}
function reportProgress(dk){
  if(!dk||dk.source!=='teacher'||!ST.myRoster) return;
  const s=deckStats(dk);
  const weak=dk.cards.map(c=>({id:c.id,s:sched(dk.key,c.id)})).filter(x=>isWeak(x.s)).sort((a,b)=>b.s.miss-a.s.miss).slice(0,40).map(x=>({id:x.id,miss:x.s.miss}));
  ST.myRoster.progress[dk.id]={total:s.all,learned:s.learned,mastered:s.mastered,weak,last:Date.now()};
  ST.myRoster.lastSeen=Date.now(); ST.myRoster.xp=ST.stats.xp; pushRoster();
}
const sortedStudents=()=>ST.students.slice().sort((a,b)=>(a.addedAt||a.joinedAt||0)-(b.addedAt||b.joinedAt||0));
function selectStudent(id,rerender=true){
  if(ST.unsubStu){ST.unsubStu();ST.unsubStu=null;}
  ST.selStu=id; ST.stuDecks=[];
  if(id) ST.unsubStu=ST.db.collection('assigned/'+id+'/decks').onSnapshot(s=>{
    ST.stuDecks=s.docs.map(d=>({id:d.id,...d.data()}));
    if(V.name==='home'||V.name==='list') render();
  },()=>{});
  if(rerender) render();
}
async function fillPeople(){
  if(!ST.user) return;
  const els=[...document.querySelectorAll('[data-uid]')]; if(!els.length) return;
  const ps=await ST.user.profiles([...new Set(els.map(e=>e.dataset.uid))]);
  els.forEach(e=>{const p=ps[e.dataset.uid];if(!p)return;
    if(e.tagName==='IMG') e.src=p.avatarUrl; else e.textContent=p.name||'Ученик без имени';});
}

/* ===================== отрисовка ===================== */
function go(v){V=v; clearInterval(timer); render(); pulse('#app','enter'); window.scrollTo({top:0});}
function render(){
  if(!ST.ready) return;
  const views={home:vHome,edit:vEdit,study:vStudy,flash:vFlash,quiz:vQuiz,match:vMatch,list:vList,weak:vWeak};
  $('#app').innerHTML=(views[V.name]||vHome)();
  renderGuide();
  if(V.name==='match'&&!V.done&&!V.over) startTimer();
  const ans=$('#ans'); if(ans) ans.focus({preventScroll:true});
  const ended=(V.name==='study'&&V.total&&!V.queue.length)||(V.name==='quiz'&&V.i>=V.qs.length)||(V.name==='match'&&V.done);
  if(ended&&!V.winFx){V.winFx=true;afterRender(()=>{FX.fireworks(V.name==='quiz'&&V.score/V.qs.length<.5?2:6);SND.win();});}
  if(V.over&&!V.overFx){V.overFx=true;SND.defeat();FX.flash('fallen');}
  const q=POST.splice(0);
  requestAnimationFrame(()=>{q.forEach(f=>f());
    document.querySelectorAll('.heart.drop').forEach(el=>{const r=rectOf(el);SND.hurt();FX.burst(r.x,r.y,{n:16,speed:3.5,g:.25,shard:true,size:2.5,colors:['#e45a43','#ff9b6b']});});
    document.querySelectorAll('.heart.gain').forEach(el=>{const r=rectOf(el);SND.heal();FX.ring(r.x,r.y,'#ff9b6b',26);FX.burst(r.x,r.y,{n:18,speed:3,g:-.02,colors:['#ffcf8a','#e45a43','#fff4d6']});});
  });
  fillPeople();
}
const modebar=(mode,title)=>`<div class="modebar"><button class="btn quiet" data-act="home">← Назад</button><div class="ttl"><span class="lbl">${mode}</span><h2>${h(title)}</h2></div></div><div id="gslot"></div>`;

function pupilWeak(sid,deckId){const st=ST.students.find(x=>x.id===sid);const p=st&&st.progress&&st.progress[deckId];return (p&&p.weak)||[];}
function deckCard(dk){
  const s=deckStats(dk); const init=(dk.name||'?').trim().charAt(0).toUpperCase()||'?';
  const k=`data-key="${dk.key}"`; const words=dk.cards.filter(c=>tOf(c)==='word').length;
  let acts='';
  if(dk.studiable) acts=`<button class="btn primary" data-act="study" ${k} ${s.all?'':'disabled'}>Учить${s.due+Math.min(s.nw,20)?` · ${s.due+Math.min(s.nw,20)}`:''}</button>
    <button class="btn" data-act="flash" ${k} ${s.all?'':'disabled'}>Карточки</button>
    <button class="btn" data-act="quiz" ${k} ${s.all?'':'disabled'}>Тест</button>
    <button class="btn" data-act="match" ${k} ${words>=3?'':'disabled'} title="${words>=3?'':'Нужно хотя бы 3 карточки-слова'}">Пары</button>
    <button class="btn quiet" data-act="list" ${k}>Список</button>
    ${dk.editable?`<button class="btn quiet" data-act="edit" ${k}>Изменить</button>`:''}${dk.source==='mine'?`<button class="btn quiet" data-act="share" ${k}>Поделиться</button>`:''}${dk.source==='teacher'?`<button class="btn quiet" data-act="rmasg" ${k}>Убрать</button>`:''}`;
  else acts=`<button class="btn primary" data-act="edit" ${k}>Изменить задания</button>
    <button class="btn" data-act="list" ${k} ${s.all?'':'disabled'}>Список и ошибки</button>
    ${ST.students.length>1?`<button class="btn quiet" data-act="copyto" ${k}>Дать другому</button>`:''}`;
  let meta;
  if(dk.source==='pupil'){
    const st=ST.students.find(x=>x.id===dk.sid); const p=st&&st.progress&&st.progress[dk.id];
    const pct=p&&p.total?Math.round(p.learned/p.total*100):0; const wk=(p&&p.weak||[]).length;
    meta=`<div class="prog-line"><span>Изучено ${p?p.learned:0} из ${s.all}</span><div class="bar"><i style="width:${Math.min(100,pct)}%"></i></div></div>
      ${wk?`<div class="counts"><span class="due"><b>${wk}</b>даются плохо</span></div>`:''}
      <span class="muted">${p?`Закреплено надолго: ${p.mastered} · ${ago(p.last)}`:'Ученик ещё не открывал эту колоду'}</span>`;
  }else meta=s.all?`<div class="counts"><span class="due"><b>${s.due}</b>к повторению</span><span class="new"><b>${s.nw}</b>новых</span>${s.weak?`<span class="due"><b>${s.weak}</b>трудных</span>`:''}</div>`
    :`<p class="muted">${dk.editable?'Колода пуста. Добавьте первые задания.':'Учитель ещё не добавил задания.'}</p>`;
  return `<article class="deck ${dk.source==='teacher'?'teacher':''}">
    <div class="head"><span class="initial">${h(init)}</span><div style="min-width:0"><h3>${h(dk.name)}</h3>
      ${dk.source==='teacher'?'<span class="from">от учителя</span>':dk.sample?'<span class="from" style="color:var(--ivory-2)">пример</span>':''}
      ${dk.cards.length?`<span class="mix">${mixLine(dk.cards)}</span>`:''}</div></div>
    ${meta}<div class="acts">${acts}</div></article>`;
}
function weakBox(){
  const w=allWeak(); if(!w.length) return '';
  return `<section class="weakbox"><div class="sec-head"><h3>Даются плохо · ${w.length}</h3><div class="row">
      <button class="btn primary" data-act="drill">Тренировать трудные</button><button class="btn quiet" data-act="weak">Весь список</button></div></div>
    <div class="chips">${w.slice(0,10).map(x=>`<span class="chip">${h(plainFront(x.c))}<b>×${x.s.miss}</b></span>`).join('')}${w.length>10?`<span class="chip">ещё ${w.length-10}</span>`:''}</div>
    <p class="muted">Слово уходит из этого списка после трёх верных ответов подряд.</p></section>`;
}
function mineSection(){
  const decks=ST.myDecks.map(d=>deckCard(getDeck('m:'+d.id))).join('');
  return `<section class="sec"><div class="sec-head"><h2>Мои колоды</h2><div class="row"><button class="btn primary" data-act="newmine">+ Новая колода</button></div></div>
    ${decks?`<div class="decks">${decks}</div>`:`<div class="empty"><p>Здесь будут ваши собственные колоды. Создайте первую и добавьте слова, пропуски или предложения для перевода.</p></div>`}</section>`;
}
function vHome(){
  if(ST.isTeacher){
    const tabs=`<div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="${ST.tab==='students'}" data-act="tab" data-tab="students">Ученики${ST.reports.length?` · ${ST.reports.length}`:''}</button>
      <button class="tab" role="tab" aria-selected="${ST.tab==='mine'}" data-act="tab" data-tab="mine">Мои колоды</button></div>`;
    return '<div id="gslot"></div>'+tabs+(ST.tab==='mine'?weakBox()+mineSection():teacherSection());
  }
  const assigned=ST.assigned.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(d=>deckCard(getDeck('a:'+d.id))).join('');
  let total=0; studiableDecks().forEach(dk=>{const s=deckStats(dk);total+=s.due+Math.min(s.nw,20)});

  const teacherSec=`<section class="sec"><div class="sec-head"><h2>Задания <em>от учителя</em></h2><div class="row">${ST.assigned.length?'<button class="btn primary" data-act="report">Отчёт учителю</button>':''}<button class="btn" data-act="paste">Вставить код</button></div></div>
    ${assigned?`<div class="decks">${assigned}</div>`:`<div class="empty"><p>Попросите учителя прислать ссылку на колоду и откройте её — задания появятся здесь. Если пришёл код, нажмите «Вставить код».</p></div>`}</section>`;
  return '<div id="gslot"></div>'+weakBox()+teacherSec+mineSection();
}


/* ---------- списки слов ---------- */
function wordTable(rows,showDeck){
  if(!rows.length) return `<div class="empty"><p>Под этот фильтр ничего не подходит.</p></div>`;
  return `<div class="tablewrap"><table class="words"><thead><tr><th></th><th>Задание</th><th>Ответ</th><th>Тип</th>${showDeck?'<th>Колода</th>':''}<th>Статус</th></tr></thead><tbody>
    ${rows.map((r,i)=>`<tr class="${r.st&&r.st.cls==='hard'?'is-hard':''}"><td class="num">${i+1}</td>
      <td>${tOf(r.c)==='gap'?fullHTML(r.c):h(r.c.f)}${tOf(r.c)==='gap'&&r.c.b?`<div class="hint">${h(r.c.b)}</div>`:''}</td>
      <td>${tOf(r.c)==='gap'?h(answerText(r.c)):h(tOf(r.c)==='trans'?r.c.b.split('/').map(x=>x.trim()).join(' / '):r.c.b)}</td>
      <td><span class="tb ${tOf(r.c)}-t">${TYPES[tOf(r.c)]}</span></td>
      ${showDeck?`<td>${h(r.deck)}</td>`:''}
      <td>${r.st?`<span class="pill ${r.st.cls}">${r.st.t}</span>${r.st.miss?`<span class="miss">ошибок: ${r.st.miss}</span>`:''}`:''}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function vList(){
  const dk=getDeck(V.key); if(!dk) return vHome();
  const f=V.filter||'all';
  let rows;
  if(dk.source==='pupil'){
    const wm=Object.fromEntries(pupilWeak(dk.sid,dk.id).map(w=>[w.id,w.miss]));
    rows=dk.cards.filter(valid).map(c=>({c,st:wm[c.id]?{cls:'hard',t:'даётся плохо',miss:wm[c.id]}:null}));
    if(f==='hard') rows=rows.filter(r=>r.st);
    const nW=Object.keys(wm).length;
    return `${modebar('Список заданий · колода ученика',dk.name)}
      <div class="filters"><button class="btn" data-act="filter" data-f="all" aria-pressed="${f==='all'}">Все · ${dk.cards.length}</button>
        <button class="btn" data-act="filter" data-f="hard" aria-pressed="${f==='hard'}">Даются плохо · ${nW}</button>
        <button class="btn quiet" data-act="edit" data-key="${dk.key}">Изменить задания</button></div>
      ${wordTable(rows,false)}`;
  }
  rows=dk.cards.filter(valid).map(c=>({c,st:statusOf(dk.key,c)}));
  const cnt=k=>rows.filter(r=>r.st.cls===k).length;
  const shown=f==='all'?rows:rows.filter(r=>r.st.cls===(f==='learn'?'':f));
  if(f==='hard') shown.sort((a,b)=>b.st.miss-a.st.miss);
  return `${modebar('Список заданий',dk.name)}
    <div class="filters">${[['all','Все',rows.length],['hard','Даются плохо',cnt('hard')],['new','Новые',cnt('new')],['learn','Изучаются',cnt('')],['master','Закреплены',cnt('master')]]
      .map(([k,t,n])=>`<button class="btn" data-act="filter" data-f="${k}" aria-pressed="${f===k}">${t} · ${n}</button>`).join('')}
      ${cnt('hard')?`<button class="btn primary" data-act="drill" data-key="${dk.key}">Тренировать трудные</button>`:''}</div>
    ${wordTable(shown,false)}`;
}
function vWeak(){
  const w=allWeak();
  return `${modebar('Все колоды','Даются плохо')}
    <div class="filters">${w.length?`<button class="btn primary" data-act="drill">Тренировать все · ${w.length}</button>`:''}</div>

}

function saveDraft(){

/* ---------- учёба и тренировка трудных ---------- */
function startStudy(key){
  const dk=getDeck(key), now=Date.now(); const cards=dk.cards.filter(valid);
  const due=shuffle(cards.filter(c=>{const s=sched(key,c.id);return !s.n&&s.due<=now})).map(c=>({key,cid:c.id}));
  const nw=cards.filter(c=>sched(key,c.id).n).slice(0,20).map(c=>({key,cid:c.id}));
  go({name:'study',title:dk.name,key,queue:[...due,...nw],shown:false,res:null,ans:'',done:0,again:0,xp:0,total:due.length+nw.length,drill:false,...lifeState()});
}
function startDrill(key){
  const items=(key?allWeak().filter(x=>x.key===key):allWeak()).slice(0,30).map(x=>({key:x.key,cid:x.c.id}));
  go({name:'study',title:key?getDeck(key).name:'Трудные слова',key,queue:shuffle(items),shown:false,res:null,ans:'',done:0,again:0,xp:0,total:items.length,drill:true,requeued:[],...lifeState()});
}
const itemCard=it=>{const dk=getDeck(it.key);return dk&&dk.cards.find(c=>c.id===it.cid);};
const typedLabel=c=>tOf(c)==='gap'?'вставьте пропущенное слово':'переведите на английский';
function verdictHTML(c){
  const t={ok:'Верно',typo:'Почти верно — опечатка',bad:'Неверно'}[V.res];
  return `<div class="verdict ${V.res}"><b>${t}</b>${V.res!=='ok'?`<span class="yours">Ваш ответ: ${V.res==='bad'?'<s>':''}${h(V.ans||'—')}${V.res==='bad'?'</s>':''}</span>`:''}
    <span>Правильно: ${tOf(c)==='gap'?fullHTML(c):h(answerText(c))}</span></div>`;
}
function vStudy(){

    return `${modebar(mode,V.title)}<div class="stage"><div class="leaf result"><span class="fleuron">❦</span><h3>${V.drill?'Трудных слов нет':'Пока нечего повторять'}</h3>
      <p class="muted">${V.drill?'Все ошибки исправлены.':when?`Следующее повторение через ${when} ${plural(when,'день','дня','дней')}. А пока можно пройти тест или пролистать карточки.`:'В колоде нет заданий.'}</p>
      <div class="row"><button class="btn primary" data-act="home">К колодам</button>${dk&&!V.drill?`<button class="btn" data-act="quiz" data-key="${dk.key}">Тест</button>`:''}</div></div></div>`;
  }

      <div class="row"><button class="btn primary" data-act="home">К колодам</button>${left&&!V.drill?`<button class="btn" data-act="drill">Тренировать трудные · ${left}</button>`:''}</div></div></div>`;
  }

    :(()=>{let nN=0,nR=0;new Set(V.queue.map(q=>q.cid)).forEach(id=>sched(V.key,id).n?nN++:nR++);return `<span class="n">Новые <b>${nN}</b></span><span class="r">Повторить <b>${nR}</b></span><span>Пройдено <b>${V.done}</b></span>`;})();

    leaf=`<div class="leaf"><span class="lbl">${typedLabel(c)}${isWeak(s)?' · даётся плохо':''}</span><div class="q ${isLong(c.f)?'long':''}">${frontHTML(c)}</div>
      ${V.res?'':hintArea(c)}</div>`;
    if(!V.res) controls=`<form class="typebox" data-form="check"><input class="f" id="ans" placeholder="${tOf(c)==='gap'?'Пропущенное слово':'Перевод на английский'}" autocomplete="off" autocapitalize="off" spellcheck="false" value="${h(V.ans)}">
      <button class="btn primary" type="submit">Проверить</button></form><div class="answers">${hintBtn()}<button class="btn quiet" data-act="giveup">Не знаю, показать ответ</button></div>`;
    else{
      let btns;

      else if(V.res==='bad') btns=`<button class="btn g0" data-act="grade" data-g="0">Снова<small>через 1 мин</small><span class="kbd">enter</span></button>${V.ans?`<button class="btn quiet" data-act="grade" data-g="1" data-refund="1">Я ответил верно</button>`:''}`;
      else btns=[1,2,3].map(g=>`<button class="btn g${g}" data-act="grade" data-g="${g}">${['','Трудно','Хорошо','Легко'][g]}<small>через ${fmtIvl(schedule(s,g).ivl)}</small><span class="kbd">${g+1}${g===(V.res==='typo'?1:2)?' · enter':''}</span></button>`).join('');
      controls=verdictHTML(c)+`<div class="answers">${btns}</div>`;
    }
  }else{
    leaf=`<div class="leaf"><span class="lbl">${s.n&&!V.drill?'новое слово':isWeak(s)?'даётся плохо':'повторение'}</span><div class="q ${isLong(c.f)?'long':''}">${h(c.f)}</div>
      ${V.shown?`<span class="fleuron">❦</span><div class="a ${isLong(c.b)?'long':''}">${h(c.b)}</div>`:hintArea(c)}</div>`;
    if(!V.shown) controls=`<div class="answers">${hintBtn()}<button class="btn primary" data-act="show" style="flex:0 1 320px;padding:14px">Показать ответ <span class="kbd">пробел</span></button></div>`;
    else if(V.drill) controls=`<div class="answers"><button class="btn g0" data-act="dnext" data-ok="0">Не помню<span class="kbd">1</span></button><button class="btn g2" data-act="dnext" data-ok="1">Помню<span class="kbd">2</span></button></div>`;
    else controls=`<div class="answers">${['Снова','Трудно','Хорошо','Легко'].map((n,i)=>`<button class="btn g${i}" data-act="grade" data-g="${i}">${n}<small>через ${fmtIvl(schedule(s,i).ivl)}</small><span class="kbd">${i+1}</span></button>`).join('')}</div>`;
  }
  return `${modebar(mode,V.title)}
  <div><div class="progress"><i style="width:${Math.round(V.done/(V.done+V.queue.length)*100)}%"></i></div><div class="tally">${tally}${livesHTML()}</div></div>
  <div class="stage">${leaf}${controls}</div>`;
}
function submitCheck(){

  const xp=V.hint?Math.ceil([1,3,5,6][g]/2):[1,3,5,6][g]; V.xp+=xp; addXP(xp);

function drillNext(ok){

    <div class="navrow"><span class="muted">Знаю: ${V.known} · Не знаю: ${V.unknown}</span><button class="btn quiet" data-act="fshuffle">Перемешать</button><button class="btn quiet" data-act="fswap">${V.swap?'Слова: сначала слово':'Слова: сначала перевод'}</button></div>

function know(ok){

/* ---------- тест ---------- */
function startQuiz(key){
  const dk=getDeck(key); const cards=dk.cards.filter(valid); const words=cards.filter(c=>tOf(c)==='word');
  const qs=shuffle(cards).slice(0,10).map(c=>{
    if(tOf(c)==='word'&&words.length>=4){
      const others=shuffle(words.filter(x=>x.id!==c.id&&x.b!==c.b)).slice(0,3).map(x=>x.id);
      if(others.length===3) return {id:c.id,mode:'mc',opts:shuffle([c.id,...others])};
    }
    return {id:c.id,mode:'type'};
  });
  go({name:'quiz',key,qs,i:0,picked:null,res:null,ans:'',score:0,xp:0,wrong:[],...lifeState()});
}
function vQuiz(){

      ${V.wrong.length?`<div class="chips" style="justify-content:center">${V.wrong.map(id=>`<span class="chip">${h(plainFront(by(id)))}</span>`).join('')}</div>`:''}
      <div class="row"><button class="btn primary" data-act="quiz" data-key="${dk.key}">Ещё раз</button>${V.wrong.length?`<button class="btn" data-act="drill" data-key="${dk.key}">Тренировать ошибки</button>`:''}<button class="btn quiet" data-act="home">К колодам</button></div></div></div>`;
  }

      ${V.res?verdictHTML(c):`<form class="typebox" data-form="qcheck"><input class="f" id="ans" placeholder="Ваш ответ" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn primary" type="submit">Проверить</button></form>`}`;
  }
  return `${modebar('Тест',dk.name)}
  <div><div class="progress"><i style="width:${Math.round(V.i/V.qs.length*100)}%"></i></div><div class="tally"><span>Вопрос <b>${V.i+1}</b> из ${V.qs.length}</span><span>Верно <b>${V.score}</b></span>${livesHTML()}</div></div>

function quizResult(ok,at){

function qnext(){if(V.lives<=0&&V.i+1<V.qs.length){V.over=true;render();return;}V.i++;V.picked=null;V.res=null;V.ans='';V.hint=false;V.gone=[];V.say=null;V.mood='';V.lowSay=null;render();}

/* ===================== обмен по ссылкам (без сервера) ===================== */
async function enc(prefix,obj){
  let bytes=new TextEncoder().encode(JSON.stringify(obj)),v='0';
  if(window.CompressionStream){try{const st=new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));bytes=new Uint8Array(await new Response(st).arrayBuffer());v='1';}catch(e){}}
  let bin='';for(let i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);
  return prefix+v+'.'+btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function dec(text){
  const m=String(text).match(/([DR])([01])\.([A-Za-z0-9_-]{8,})/); if(!m) throw new Error('nocode');
  const b64=m[3].replace(/-/g,'+').replace(/_/g,'/'); const bin=atob(b64+'==='.slice((b64.length+3)%4));
  let bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  if(m[2]==='1'){if(!window.DecompressionStream)throw new Error('old');const st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));bytes=new Uint8Array(await new Response(st).arrayBuffer());}
  return {kind:m[1],data:JSON.parse(new TextDecoder().decode(bytes))};
}

    saveAssigned(); if(ST.isTeacher){ST.isTeacher=false;ST.settings.role='student';saveSettings();renderHeader();}
    go({name:'home'}); toast('Колода добавлена'); SND.win(); FX.fireworks(3);
  }else{const d=r.data; const nm=(d.n||'Без имени').trim();
    const i=ST.reports.findIndex(x=>(x.n||'').toLowerCase()===nm.toLowerCase());
    if(i>=0){if((ST.reports[i].t||0)<=d.t)ST.reports[i]=d;}else ST.reports.push(d);

function bulkAdd(){
  const t=V.bulkType||'word'; const seps=['\t',' — ',' – ',' - ','—','–',';'];let n=0,bad=0;
  $('#bulk').value.split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{
    const s=seps.find(x=>l.includes(x));
    let f=l,bk='';
    if(s){const i=l.indexOf(s);f=l.slice(0,i).trim();bk=l.slice(i+s.length).trim();}
    if(t==='gap'){if(!groups(f).length){bad++;return;}}
    else if(!f||!bk){bad++;return;}
    V.draft.cards.push(mkCard(f,bk,t));n++;});
  V.draft.cards=V.draft.cards.filter(c=>c.f||c.b);
  if(n){saveDraft();render();toast(`Добавлено заданий: ${n}`);}
  if(bad){const el=$('#bulk-err');el.hidden=false;el.textContent=t==='gap'?`Не разобрано строк: ${bad}. В каждом предложении пропуск должен быть в [квадратных скобках].`:`Не разобрано строк: ${bad}. Разделите задание и ответ тире, «;» или табуляцией.`;}
}

function fmove(d){V.i=(V.i+d+V.order.length)%V.order.length;V.flipped=false;render();}

  }else if(V.name==='flash'){
    if(e.key===' '){e.preventDefault();flip();} else if(e.key==='ArrowRight')fmove(1); else if(e.key==='ArrowLeft')fmove(-1);

});

let SW=null, swallow=false;
document.addEventListener('pointerdown',e=>{const f=e.target.closest('#flipcard');if(!f||V.name!=='flash')return;SW={x:e.clientX,y:e.clientY,id:e.pointerId,moved:false};},{passive:true});
document.addEventListener('pointermove',e=>{if(!SW||e.pointerId!==SW.id)return;const dx=e.clientX-SW.x,dy=e.clientY-SW.y;
  if(!SW.moved&&Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy))SW.moved=true;
  if(SW.moved){const w=$('.flip-wrap');if(w){w.style.transition='none';w.style.transform=`translateX(${dx}px) rotate(${dx/22}deg)`;w.dataset.dir=dx>40?'yes':dx<-40?'no':'';}}},{passive:true});
function endSwipe(e){if(!SW||e.pointerId!==SW.id)return;const dx=e.clientX-SW.x,moved=SW.moved;SW=null;const w=$('.flip-wrap');
  if(w){w.style.transition='transform .25s ease';w.style.transform='';w.dataset.dir='';}
  if(moved){swallow=true;setTimeout(()=>swallow=false,50);const dk=getDeck(V.key);if(Math.abs(dx)>80&&dk&&dk.studiable)know(dx>0);}}
document.addEventListener('pointerup',endSwipe,{passive:true});document.addEventListener('pointercancel',endSwipe,{passive:true});
FX.init();
boot();
